id: 14-flip-average
title: 八向翻转平均(8 次读落在 4 个时刻上,其中 3 个隔了几十 MB)
difficulty: 2
tags: [3d, memory-bound, l2, reuse-distance, tta, boundary]
concepts:
  - 复用距离:同一个元素两次被用到之间,隔了多少字节的流量 —— 这才是"缓存管不管用"的判据
  - L2 只有 72MB:隔了几十万个元素的重读,L2 接不住,只能再走一趟显存
  - 轨道:8 个翻转位置需要的输入是**同一组** ⇒ 一个线程读 8 个、写 8 个
  - '逻辑读几次 vs 落在几个时刻:同一时刻的重复读被 L1/L2 合并掉,一分钱不花'
  - 三维索引与三维网格:blockIdx.z、线性下标的算法
  - 奇数维度:中间那一层/行/列是它自己的镜像(轨道退化),写重了就是竞态
statement: problem.md

# x 是 d×h×w 的三维张量(row-major,线性下标 ((b*h + i)*w + j)),out 同形状。
#
# 语义:对每个位置,把它在「三个轴各自翻不翻转」的 8 种组合下的对应位置求平均:
#   out[b][i][j] = (1/8) * Σ_{kb,ki,kj ∈ {0,1}} x[ b' ][ i' ][ j' ]
#   其中 b' = kb ? d-1-b : b,i' = ki ? h-1-i : i,j' = kj ? w-1-j : j
#
# 这是数据增强里最常见的一类操作(TTA:把 8 个翻转版本的预测平均),
# 维度换成 3 就是体数据/医疗影像那一套。
#
# 三个维度都允许是奇数 —— 这时中间那一层/行/列**是自己的镜像**,
# 8 项里有重复项。参考解不做特殊处理(重复项值相同,平均下来还是它自己),
# 做题者的快版本也必须保持这个语义。见题面「陷阱提醒」。
buffers:
  - {name: x,   dtype: f32, shape: [d, h, w], role: in}
  - {name: out, dtype: f32, shape: [d, h, w], role: out}
params:
  - {name: d, dtype: i32}
  - {name: h, dtype: i32}
  - {name: w, dtype: i32}

entry:
  kernel: flip_avg
  launcher: flip_avg_launch

cases:
  # 主力用例:2×8192×4096 = 67.1M 个 float = 268MiB 读 + 268MiB 写 = 536MB 访存,
  # 4090 上 DRAM 下限约 532µs。
  #
  # ★ 形状是**故意**选的,两个条件缺一不可(这两条都是拿实测倒推出来的,
  #   第一版取的是 2048×256×128,基线跑出 68% —— 梯度只有 1.45x,废了):
  #
  #   ① 张量(268MiB)要是 L2(72MB)的 3.7 倍 —— 否则重读被缓存接住,问题消失。
  #   ② **"切片"(h*w = 33.5M 个元素 = 134MB)自己也要超过 L2。**
  #      第一版形状的切片只有 128KB,于是 (b,i) 和 (b,mi) 这两组 tap 离得
  #      很近,L2 顺手就接住了 —— 8 次读里真正落空的只有 1 次(跨层的那些),
  #      等效流量 2.7(而不是现在的 4.5),基线因此跑出 68%。
  #      换成"薄层大切片"之后,4 组 tap 里有 3 组和第一组隔着几十 MB,
  #      基线才掉到 40% 出头,**梯度才立起来**。
  #      一句话:**光"张量大于 L2"不够,"复用距离"才是判据 —— 而它可以被
  #      形状藏起来。**
  #   d=2 也是有意的:最外层的翻转距离 = h*w = 134MB,恒定超过 L2,
  #   没有"中间那一层离得近"的漏网之鱼。
  #   w=4096 是 128 的倍数,行首都在 128 字节边界上 —— 先排除掉"没对齐"
  #   这个次要矛盾,慢的原因要单一,才教得清楚。
  - {name: big, params: {d: 2, h: 8192, w: 4096}}

  # ★ 边界用例:2×8191×4093(8191 与 4093 都是质数,都是奇数)= 67.1M 个元素。
  #   两个作用:
  #   ① 边界:两个维度是奇数 ⇒ 中间那一行/列都是自己的镜像,轨道退化成 4 元、
  #      2 元、1 元。快版本在这里最容易写重、写漏(重复写同一个地址且值相同
  #      = 竞态;漏写 = 被毒值抓到)。w=4093 也不是 32 的倍数,
  #      一个 warp 的尾巴是空的。
  #   ② **规模必须和 big 同量级、形状必须同样"薄层大切片"(134MB 的切片)**
  #      —— 这一条是踩过坑才写下来的:第一版取的 1021×127×97 = 50MiB,
  #      整个装得进 72MB 的 L2,于是参考解在上面测出 **141% 峰值**
  #      (写入还没落盘 kernel 就结束了)。而评级是**取所有可评级用例里的
  #      最好成绩**,一个能装进 L2 的大用例会让所有人白拿 S —— 梯度直接失效。
  #      **每个可评级用例都必须满足"复用距离 > L2"。**
  - {name: ragged, params: {d: 2, h: 8191, w: 4093}}

  # 小到远低于 20µs 的评级下限,**不参与评级** —— 专职考边界
  # (三个维度都小于一个 warp:w=19 时一个 warp 里有 13 个 lane 是空的;
  #  d/h/w 都是奇数,中间层/行/列三重退化),兼跑 racecheck。
  # racecheck 极慢,只能挂在这么小的用例上。
  - {name: tiny, params: {d: 65, h: 33, w: 19}}

verify:
  # 8 个 [-1,1) 的 float 相加再除以 8,换一种加法顺序与 double 参考值的偏差
  # 在 1e-7 量级;这里给到 1e-5 是留足了余量,不是"随便写写就能过"。
  atol: 1e-5
  rtol: 1e-4
  # repeat=3:快版本的典型 bug 是"轨道边界没切干净 ⇒ 两个线程写同一个位置",
  # 而重复写的值恰好相同(它俩算的是同一个平均值)—— 这种 bug 有时对有时错,
  # 跑一次是抓不住的。跑三遍 + racecheck 才抓得住。
  repeat: 3

perf:
  # 访存瓶颈:每个输出搬 8 字节(读 4 + 写 4),算术强度 1 FLOP/Byte,
  # 远低于 4090 的平衡点(82 FLOP/Byte)⇒ 天花板 100% 由带宽决定。
  # 用"有效带宽占峰值百分比"评分:它直接回答"离显存那堵墙还有多远",
  # 而这道题的全部空间都在"少读那 3 遍"上。
  bound: memory
  metric: bandwidth
  repeat: 50
  warmup: 10

  # 门槛由实测倒推(2026-09-28,4090,框架自动清 L2;两个用例成绩一致,
  # 下面是 big 的数字)。每一行都真写过、真跑过:
  #
  #   实现                                          用时      有效带宽   占峰值  评级
  #   基线:一输出一线程,8 个位置各读一遍              1.304 ms  412 GB/s   41%     —
  #   只把最外层成对(8 次读塌缩成 2 个时刻)            0.788 ms  681 GB/s   68%     B
  #   参考解:一线程管一轨道(读 8 写 8,只读一遍)      0.546 ms  984 GB/s   98%     S
  #   (相对基线:1.00x / 1.65x / 2.39x)
  #
  # 门槛卡在实测的**空隙**里(两边的余量都 ≥ 20%):
  #   B=54 —— 高于基线(41%)32%,低于"只成对最外层"(68%)21%。含义:**必须
  #            先把 8 次读的 4 个时刻塌缩掉**,只省一半重读是拿不到 B 的。
  #   A=78 —— 高于"塌缩到 2 个时刻"(68%),给"轨道切对了但访存/启动配置
  #            还没调好"留位置。注意 68% 到 98% 之间实测**没有斜坡**:
  #            要么读 4 遍、要么读 1 遍,中间没有"读 2 遍"的写法存在
  #            (行内那一对 j/mj 天然在同一个时刻里)。所以 A 这一档偏窄,
  #            这是这道题的物理性质,不是门槛没设好。
  #   S=88 —— 参考解 98%,留了 11% 的余量。
  grades: {B: 54, A: 78, S: 88}

sanitize:
  memcheck: true
  racecheck_case: tiny
