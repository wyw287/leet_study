id: 12-row-sort
title: 行内排序(值域只有 0..99)
difficulty: 3
tags: [sort, counting-sort, histogram, shared-memory, atomics, scatter, memory-bound]
concepts:
  - 比较排序在 GPU 上贵在哪:每一趟都要一次 __syncthreads,「趟数」就是成本
  - 值域很小的时候,排序可以一次比较都不做:直方图 → 前缀和 → 散射
  - 数据相关的写地址(scatter):compaction / 基数排序 / 分组都建立在它上面
  - 直方图和散射游标都必须每块私有一份,而且都要先清零
  - 排序的 DRAM 下限和用什么算法无关:每元素读 4 字节 + 写 4 字节
statement: problem.md

# x 里是 0..99 的整数(randint 填 0..99),要把它**按行**升序排序后写进 y。
# 行与行之间没有任何关系 —— 每一行是独立的 1024(或 1021)个元素。
buffers:
  - {name: x, dtype: i32, shape: [rows, cols], role: in, fill: randint}
  - {name: y, dtype: i32, shape: [rows, cols], role: out}
params:
  - {name: rows, dtype: i32}
  - {name: cols, dtype: i32}

entry:
  kernel: row_sort
  launcher: row_sort_launch

cases:
  # 两个大用例都是 33.5M 个 int = 134MB 读 + 134MB 写 = 268MB,
  # 4090 上 DRAM 下限约 270µs —— 远高于 20µs 的评级下限,也远大于 L2(72MB),
  # 所以测到的是真显存带宽。
  # 两题规模一样大,是为了让基线的两个毛病(趟数 = cols、每趟一次屏障)
  # 在两个用例上表现一致,评级不会因为用例不同而漂移。
  - {name: big,    params: {rows: 32768, cols: 1024}}   # cols 是 2 的幂
  # 32749 与 1021 都是质数:1021 不是 2 的幂(比较排序要补齐到 1024)、
  # 也不是 32 的倍数(跨步循环的尾巴不满),而且比 blockDim 大不了多少。
  - {name: ragged, params: {rows: 32749, cols: 1021}}
  # 小到远低于 20µs 的评级下限,所以**不参与评级** —— 专职考边界:
  # 行只有 129 个元素,一个 block 里大多数线程领不到活;兼跑 racecheck。
  # racecheck 极慢,只能挂在最小的用例上。
  - {name: tiny,   params: {rows: 37,    cols: 129}}

# y 是整数,框架对整数输出要求**精确相等**(atol/rtol 不参与整数比较)。
# 排序的输出是唯一的 —— 相同值的元素彼此不可区分,所以「稳定 / 不稳定」
# 在这里没有区别,不需要容差。
verify:
  atol: 0.0
  rtol: 0.0
  # repeat=3:这题有共享内存 + 原子操作 + 三次块内同步,漏一个 __syncthreads、
  # 或者直方图没清零,都会「有时对有时错」
  repeat: 3

perf:
  # 纯访存:每元素 8 字节 DRAM 流量(读 4 + 写 4),算术量可以忽略。
  #
  # 用加速比而不是带宽占比:基线**根本没走到带宽上** —— 它的时间全花在
  # cols 次 __syncthreads 和配套的指令发射上(见 baseline.cu 的估算)。
  # 加速比在这里的含义很干净:你把「趟数」从 cols 降到了几趟。
  # (01/02/07/08 那种「朴素实现已贴着墙、慢是因为没铺满」的题才用带宽占比。)
  bound: memory
  metric: speedup
  repeat: 50
  warmup: 10
  # 门槛由实测倒推(2026-09-27,4090,框架自动清 L2);评级取所有可评级用例里的
  # 最好成绩。下面每一行都真写过、真跑过(big 用例:32768×1024 = 134MB 读 + 134MB 写;
  # ragged 的加速比与 big 一致 —— 7.56x / 66.13x —— 所以只列 big):
  #
  #   实现                                    屏障次数   big       加速比  评级
  #   基线:奇数-偶数换位排序                 cols=1024  15.643 ms  1.00x   —
  #   bitonic 排序(整行 1024 线程在线程间交换)  55     2.158 ms   7.24x   B
  #   参考解:先散进共享内存,再合并写回        4       0.242 ms  64.64x   S
  #   计数排序,但散射直接写全局(半成品)      4       0.454 ms  34.44x   A
  #   参考解 + block 改成 1024                          0.353 ms  44.21x   S
  #
  # 三件必须写下来的事:
  #
  #   * **这题的成本就是「屏障次数 × 屏障的价钱」。** 四种实现的 DRAM 流量
  #     完全一样(8 字节/元素 = 268MB,下限 266µs),所以差距全部来自趟数。
  #     1024 趟要 15.6 ms —— 是 DRAM 下限的 59 倍,基线**从来没碰到过带宽**。
  #     bitonic 把 1024 降到 55,拿到 7.24x;但它仍然是指令/屏障受限
  #     (2.158 ms 是下限的 8 倍),所以 B 不是终点。
  #
  #   * **34.44x 与 64.64x 之间那一档是本题真正的第二个考点。** 散射的写地址
  #     由数据决定:一个 warp 的 32 个线程写到 4KB 行里的 32 个随机位置,
  #     一条 store 指令被拆成几十个 L1 事务(合并访存只要 1 个)。这笔钱约
  #     190µs,和 266µs 的 DRAM 时间叠在一起。把它先散进共享内存、再顺序搬出去,
  #     立刻回到带宽墙上(实测 1107 GB/s —— 略超标称峰值,因为计时停止时
  #     最后一批写还在 L2 里,见 01 题)。**「计数排序」和「计数排序写对了」
  #     是两件事,差了 1.9 倍。**
  #
  #   * **block 大小在这题值 1.46 倍**(256 → 1024 反而变慢,0.242 → 0.353 ms)。
  #     一行只有 1024 个元素,用 1024 个线程就只能有 2 个 block 驻留在 SM 上,
  #     掩盖访存延迟的能力塌了。这一条是"并行度不是越多越好"的干净样本。
  #
  # 门槛卡在实测的**空隙**里:
  #   B=3.0  —— 高于基线(1.00),低于 bitonic 的 7.24:换掉"一趟一趟冒泡"
  #             这个结构就该拿到
  #   A=16.0 —— 高于 bitonic 的 7.24,低于半成品的 34.44:
  #             要么写出一个比朴素 bitonic 更省屏障的比较排序,要么用计数排序
  #             但写路径还没优化
  #   S=40.0 —— 高于半成品的 34.44(留 16% 余量),低于参考解的 64.64
  #             (门槛是它的 62%):只有「一次比较都不做」+「把散射挪到
  #             便宜的地方」才够得着
  # 注意这条梯子的形状:**换算法和修写路径是两次独立的跨越**,中间没有斜坡。
  #
  # 为什么 S 定 40 而不是 45:45 会正好压在「参考解 + block 开 1024」那一行
  # (44.21x)上 —— 两三个百分点的运行间噪声就能决定它是 A 还是 S,
  # 这种门槛是假的(10 题 spec 里记过同一个坑)。40 落在 34.44 与 44.21 中间,
  # 两边各有 10% 以上的余量。block 大小仍然是题面里的一个提醒,但它不再是
  # 评级的分水岭 —— 分水岭是"有没有把散射挪进共享内存"。
  grades: {B: 3.0, A: 16.0, S: 40.0}

sanitize:
  memcheck: true
  racecheck_case: tiny
