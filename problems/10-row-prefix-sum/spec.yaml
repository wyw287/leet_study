id: 10-row-prefix-sum
title: 行内前缀和(并行 scan 入门)
difficulty: 3
tags: [scan, prefix-sum, shared-memory, memory-bound]
concepts:
  - 循环携带依赖:scan 是第一个"输出依赖输出"的算子,不能像 map 那样直接摊开
  - Hillis-Steele(步数 O(log n)、总功 O(n log n))与两段式(总功 O(n))两条路
  - 原地扫描的读写竞争:为什么每一步都要 __syncthreads,或者要双缓冲
  - 一个线程扫一行为什么慢:访存不合并 + 并行度只有 rows 个线程
  - 非 2 的幂 / 非 4 对齐的行长:补齐、边界与对齐
statement: problem.md

# x / y 都是 rows×cols 的行优先矩阵。对每一行独立地做 **inclusive** 前缀和:
#   y[r][0] = x[r][0]
#   y[r][c] = y[r][c-1] + x[r][c]        (c > 0)
# 行与行之间没有任何关系 —— 依赖性只在行内。
buffers:
  - {name: x, dtype: f32, shape: [rows, cols], role: in, fill: positive}
  - {name: y, dtype: f32, shape: [rows, cols], role: out}
params:
  - {name: rows, dtype: i32}
  - {name: cols, dtype: i32}

entry:
  kernel: row_scan
  launcher: row_scan_launch

cases:
  # 两个大用例都是 33.5M 个 float = 134MB:读一遍 + 写一遍 = 268MB,
  # 4090 上 DRAM 下限约 270µs —— 远高于 20µs 的评级下限,也远大于 L2(72MB),
  # 所以测到的是真显存带宽而不是"第二次读命中 L2"。
  # 两个用例规模一样大,是为了让基线的两个毛病(并行度 = rows、访存跨行)
  # 在两个用例上表现一致,评级不会因为用例不同而漂移。
  - {name: square, params: {rows: 32768, cols: 1024}}
  # 26203 是质数,1280 = 2^8×5 不是 2 的幂(而且 1280/256 = 5,
  # 每线程分的段长 K=5 —— 段长不整除 warp、也不等于块大小)。
  - {name: ragged, params: {rows: 26203, cols: 1280}}
  # 小到远低于 20µs 的评级下限,所以**不参与评级** —— 专职考边界:
  # cols=511 是质数、**不是 4 的倍数**(行首地址不是 16 字节对齐,
  # float4 向量化的写法会在这里翻车),而且 511 < 2×256,一个 block 里
  # 大多数线程领不到元素。兼跑 racecheck:racecheck 极慢,只能挂最小的用例。
  - {name: tiny,   params: {rows: 37, cols: 511}}

verify:
  # 每行 1024~1280 个正数(x ∈ (0,1]),行尾的前缀和约 640。
  # 参考解用 double 累加(≈精确),GPU 侧无论串行还是并行都是 f32:
  #   基线(串行 f32)误差 ~ sqrt(n)·eps·S ≈ 36×1.2e-7×640 ≈ 3e-3,
  #   而该点的容差 = atol + rtol·|exp| = 1e-5 + 1e-4×640 = 6.4e-2 —— 差 20 倍,安全。
  # 反过来,错误的实现偏差是 O(0.1) 以上(整行和就是 640),atol=1e-5 不会放过
  # "全填 0 / 全填 1 / 只写首元素"这类劣化解。
  atol: 1e-5
  rtol: 1e-4
  # repeat=3:这题有共享内存 + 每步同步,漏一个 __syncthreads 就会"有时对有时错"
  repeat: 3

perf:
  # 访存瓶颈:每个元素 8 字节 DRAM 流量(读 4 + 写 4),而 scan 的算术量
  # 只有每元素 1 次加法。片上那点共享内存流量比 DRAM 快 40 倍,可以忽略。
  #
  # 用加速比而不是带宽占比:这里的基线**不是**最优算法 —— 它既没合并访存
  # (同一 warp 的 32 个线程在 32 个不同的行上,地址差 4KB),并行度也只有
  # rows 个线程。加速比直接就是"你把这两个毛病修掉了多少",有明确物理含义。
  # (01/02/07/08 那种"朴素实现已经贴着带宽墙"的题才必须用带宽占比。)
  bound: memory
  metric: speedup
  repeat: 50
  warmup: 10
  # 门槛由实测倒推(2026-09-27,4090,框架自动清 L2);评级取所有可评级用例里的
  # 最好成绩。下面每一行都真写过、真跑过(square 与 ragged 都是 134MB,加速比
  # 几乎一样,只列 square):
  #
  #   实现                                          square     加速比   评级
  #   把 scan 做在全局内存上(Hillis-Steele,10 趟)   1.230 ms   0.80x    C
  #   基线:一个线程扫一行                           0.983 ms   1.00x    —
  #   半成品:搬进共享内存,块内让线程 0 串行扫       0.253 ms   3.89x    S
  #   参考解:块内两段式并行 scan                    0.241 ms   4.08x    S
  #
  # 三件必须写下来的事:
  #
  #   * **这题的门槛是台阶,不是斜坡:1.0x 与 3.9x 之间基本是空的。**
  #     DRAM 流量被题目定死(读 4 + 写 4 = 8 字节/元素),任何"合并访存 +
  #     并行度足够"的实现都撞同一堵墙(268MB / 1008GB/s ≈ 270µs,实测 241µs
  #     里还含"计时结束时最后一批写仍在 L2"的水分)。所以 S 只能卡在台阶上面,
  #     B/A 留给"修了一半"的实现 —— 中间地带确实很窄,这是物理决定的,不是
  #     门槛没调好。
  #   * **第三行 = 3.89x 是本题最反直觉的实测结果**:块内那条 cols 长的串行
  #     依赖链几乎不要钱。同一个 SM 上驻留 8 个 block,8 条**独立**的串行链
  #     合起来是 8 元素/4 周期 = 0.5 周期/元素,而 DRAM 摊到每 SM 是
  #     8 字节/3.1 字节每周期 ≈ 2.6 周期/元素 —— 差 5 倍,遮得住。
  #     换句话说:**值钱的是"整行留在片上 + 访存合并",不是"块内并行"。**
  #     前提是行装得下、驻留数够多;行再长一倍(驻留数掉到 1~2)结论就会翻转。
  #   * 第四行(全局内存版 scan)算法是对的但比基线还慢:每轮读 2n 写 n、
  #     log₂(cols)=10 轮 → 120 字节/元素,而基线只有约 32 字节/元素。
  #     留这个数字是为了说明"正确"和"快"是两件事。
  #
  # 门槛:
  #   B=1.5 —— 明显超过基线,证明结构动了(全局内存版 0.80x 拿不到)
  #   A=2.5 —— 台阶中段
  #   S=3.5 —— 结构对了、贴着带宽墙;两个不同的正确实现实测 3.89x / 3.96x,
  #            门槛留了 10% 余量(不卡在 3.9:3.89 与 4.08 的差只有 5%,
  #            而且在 ragged 用例上两者顺序还会翻转 —— 那是噪声,不该当门槛)
  grades: {B: 1.5, A: 2.5, S: 3.5}

sanitize:
  memcheck: true
  racecheck_case: tiny
