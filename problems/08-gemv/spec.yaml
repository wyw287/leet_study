id: 08-gemv
title: 矩阵-向量乘(GEMV)
difficulty: 2
tags: [gemv, memory-bound, coalescing, warp-shuffle, grid-stride]
concepts:
  - 算术强度:每读进 4 个字节只做 1 次乘加,所以天花板就是带宽
  - 访存合并:一条 load 指令被拆成几个 32 字节的 sector
  - 一个 warp 负责一行:让 32 个 lane 读连续的列
  - warp shuffle 归约:一个 warp 内部就能算完,不需要共享内存与 __syncthreads
  - grid-stride:线程个数不必等于输出个数
statement: problem.md

# a 是 m×n(row-major),x 长 n,y 长 m:y[r] = Σ_c a[r][c] * x[c]
buffers:
  - {name: a, dtype: f32, shape: [m, n], role: in}
  - {name: x, dtype: f32, shape: [n],    role: in}
  - {name: y, dtype: f32, shape: [m],    role: out}
params:
  - {name: m, dtype: i32}
  - {name: n, dtype: i32}

entry:
  kernel: gemv
  launcher: gemv_launch

cases:
  # 主力用例:4096×8192 的矩阵 = 32M 个 float = 128MiB 读。
  # 20µs 的评级下限要求数据量给足 —— 128MiB 在 4090 上约 133µs(按 1008 GB/s)。
  # 注意行数只有 4096:基线「一个线程算一行」在这题上只能开出 4096 个线程
  # (= 16 个 256 线程块),而 4090 有 128 个 SM。用例取这个形状是**故意**的,
  # 详见题面「基线慢在哪」。
  - {name: wide, params: {m: 4096, n: 8192}}
  # 4099 与 8191 都是质数,而且 8191 不是 32 的倍数:
  #   * 每行 8191 个 float = 32764 字节,不是 128 的倍数 —— 行首不在 128 字节边界上
  #   * warp 内每个 lane 要走 255 或 256 次循环(lane 0 多走那一次),尾巴不满
  # 规模与 wide 同量级(134MB),保证两个用例的带宽占比可比。
  - {name: ragged, params: {m: 4099, n: 8191}}
  # 小到总耗时远低于 20µs 的评级下限,所以它**不参与评级** —— 专职考边界
  # (n=129 不是 32 的倍数;m=257 时向上取整的网格会多出几个领不到行的 warp)
  # 兼跑 racecheck。racecheck 极慢,只能挂在这么小的用例上。
  - {name: tiny, params: {m: 257, n: 129}}

# 容差的依据:
#   * 输入是 [-1,1) 的均匀分布,y[r] ≈ N(0, n/3) —— 4096 行里必然有几行的真值
#     因为正负相消而接近 0。那几行的容差只剩 atol,所以 atol 不能取 1e-5 这种
#     量级,否则基线的 f32 顺序累加(实测偏差 1e-4 量级)自己就会挂。
#   * 反过来,atol=1e-2 也不会放过错误实现:漏乘一列、行错位这类 bug 改变 y 的
#     量级是 0.1~10(单个乘积就是 O(0.25) 的量级),离 1e-2 还差一个数量级。
#   * repeat=3:这题没有共享内存也没有原子操作,但「有时对有时错」的错法依然存在
#     (比如越界读到了别的行、warp 分支没收敛就做 shuffle)。
#
# 顺带记一个实测现象:两个大用例的字节数完全一样,基线的耗时却差 27%
# (wide 0.863ms vs ragged 0.630ms),两者的差别只有行距(32768 字节 vs 32764 字节)。
# 同一个 warp 跨固定步长取数时,2 的幂步长会牵动 DRAM/L2 的映射。这不是噪声:
# 两个用例各自重复 50 次都很稳,而合并访存之后这个差异就消失了(92% vs 92%)。
verify:
  atol: 1e-2
  rtol: 1e-4
  repeat: 3

perf:
  # 纯访存瓶颈:32M 次 FMA 只需要 0.8µs(4090 的 FP32 是 82.6 TFLOPS),
  # 而 128MiB 的搬运需要 133µs。差两个数量级 —— 这题没有任何「算得快」的空间。
  #
  # 用带宽而不是加速比评级:带宽是**绝对**指标,它直接回答「你离那堵墙还有多远」,
  # 而且不随用例形状(基线本身的好坏)漂移。基线的加速比在这题里是形状的函数:
  # m 越大基线越好看,拿它当门槛等于给用例形状打分。
  bound: memory
  metric: bandwidth
  repeat: 50
  warmup: 10
  # 门槛由实测倒推(2026-09-27,4090,框架自动清 L2)。下面每一行都真写过、
  # 真跑过,不是估算 —— 评级取「所有用例里的最好成绩」,下表列两个大用例:
  #                                                     wide              ragged
  #   基线:1 线程 1 行(4096 线程)               0.863ms 156GB/s 15%  0.630ms 213GB/s 21%   C
  #   只加并行度(lane 领行内连续段,还是散着取)  0.477ms 281GB/s 28%  0.510ms 263GB/s 26%   C
  #   参考解 + 网格封顶 16 块(128 个 warp)      0.315ms 426GB/s 42%  0.360ms 373GB/s 37%   C
  #   参考解 + 网格封顶 24 块(192 个 warp)      0.228ms 588GB/s 58%  0.253ms 531GB/s 53%   B
  #   参考解 + 网格封顶 40 块(320 个 warp)      0.162ms 830GB/s 82%  0.175ms 767GB/s 76%   A
  #   参考解 + 网格封顶 64 块(512 个 warp)      0.146ms 917GB/s 91%  0.157ms 858GB/s 85%   S
  #   参考解(4096 个 warp,不封顶)             0.144ms 931GB/s 92%  0.145ms 924GB/s 92%   S
  #   参考解 + float4                           0.144ms 930GB/s 92%  (n 不是 4 的倍数,回退标量)
  #
  # 三条门槛都卡在实测数字的**空隙**里:
  #   B=45 —— 高于「只加并行度」的 28% 与「16 块」的 42%,低于「24 块」的 58%:
  #           访存模式必须改对,而且网格不能开得太小
  #   A=65 —— 高于「24 块」的 58%,低于「40 块」的 76%
  #   S=85 —— 高于「40 块」的 82%,而参考解在两个用例上都是 92%
  # 注意这条梯子的形状:**访存模式是一票否决的**(28% 那一行线程数翻了 32 倍也没用),
  # 而并行度只有掉到几百个 warp 以下才开始伤带宽(64 块 = 512 warp 已经有 91%)。
  # 所以 C→S 之间的档位在实测里比较稀疏,中间地带是留给「改对了一半」的实现的。
  grades: {B: 45, A: 65, S: 85}

sanitize:
  memcheck: true
  racecheck_case: tiny
