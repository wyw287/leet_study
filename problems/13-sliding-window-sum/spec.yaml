id: 13-sliding-window-sum
title: 滑动窗口求和(大窗口:每个元素被从 L1 里取了 w 次)
difficulty: 2
tags: [sliding-window, strength-reduction, l1-throughput, coalescing, arithmetic-intensity, warp-scan]
concepts:
  - 这题不是"搬得太多":显存流量满分,垮掉的是 L1 的取数带宽
  - 每个输出只有约 80 条 load 的配额(对应显存那 8 字节),朴素实现要 w+1 条
  - 强度削减:out[i] = out[i-1] + x[i] - x[i-w],把 O(w) 变成 O(1)
  - 但它要求「一个线程管连续的输出」⇒ warp 访存散掉(08 的坑),实测白改
  - 出路有两条:接受多一趟流量(先前缀和再做差),或让 warp/block 协作(scan)
statement: problem.md

# x 是 0..99 的整数(randint 填 0..99),要求长度为 w 的**尾窗**之和:
#   out[i] = x[max(0,i-w+1)] + ... + x[i-1] + x[i]
# 数组开头那 w-1 个输出的窗口是不满的(被裁到下标 0),这是题目的一部分。
#
# 值域 0..99 是刻意的:窗口最长 w=512,和最大 512*99 = 50688,int 装得下;
# 前缀和那条路的中间结果最大 16.7M*99 = 1.66e9 —— int32 刚好装得下
# (2.147e9),再大一点就必须上 int64。整数的和是精确的,所以这题**没有容差**。
buffers:
  - {name: x,   dtype: i32, shape: [n], role: in, fill: randint}
  - {name: out, dtype: i32, shape: [n], role: out}
  # scratch:框架只负责分配,内容不初始化、也不参与对拍。
  # 想走"两趟:先算一遍前缀和落进 tmp,再做差"这条路的话,你需要它
  # (扫描的中间结果没有地方放;out 不能被自己覆盖 —— out[i] 要读 out[i-w],
  # 而 i-w 那个位置可能已经被别的线程改掉了)。
  # 不需要就完全不用理它 —— 参考解就没碰它。
  - {name: tmp, dtype: i32, shape: [n], role: scratch}
params:
  - {name: n, dtype: i32}
  - {name: w, dtype: i32}

entry:
  kernel: window_sum
  launcher: window_sum_launch

cases:
  # 两个大用例都是 16.7M 个 int = 67MB 读 + 67MB 写 = 134MB,
  # 4090 上 DRAM 下限约 133µs —— 远高于 20µs 的评级下限,也远大于 L2(72MB),
  # 所以测到的是真显存带宽。
  #
  # w 是这道题的"难度旋钮":朴素实现的代价是 w+1 条 load/输出,
  # w=512 时 513 条,而 L1 给的配额只有 ~80 条。w 调小,梯度就消失
  # (w=8 时朴素实现直接贴着带宽墙),w 调大,朴素实现就彻底趴下。
  - {name: big,    params: {n: 16777216, w: 512}}   # n 是 2^24,w 是 2 的幂
  # 16777259 是质数级,w=509 也是质数:考边界处理(不满的窗口、chunk/warp 的
  # 尾巴、不整除任何块大小),而且 w 不是 2 的幂 —— 靠移位/掩码取窗口的实现
  # 会露馅。
  - {name: ragged, params: {n: 16777259, w: 509}}
  # 小到远低于 20µs 的评级下限,所以**不参与评级** —— 专职考边界,
  # 兼跑 racecheck(racecheck 极慢,只能挂在最小的用例上)。
  - {name: tiny,   params: {n: 262147,   w: 509}}

# out 是整数,框架对整数输出要求**精确相等**(atol/rtol 不参与整数比较)。
# 整数加法可结合、无舍入,所以"每个窗口重新加一遍"和"滚动和"的结果逐位相同,
# 不存在"算法不同结果就该不同"的借口。
verify:
  atol: 0.0
  rtol: 0.0
  # repeat=3:这题的大多数写法是无竞态的,但一旦有人在块内用共享内存中转,
  # 漏一个 __syncthreads 就会"有时对有时错"。
  repeat: 3

perf:
  # 基线**没有走到带宽上**(见 baseline.cu:它的显存流量是满分的,垮的是 L1
  # 取数带宽),所以用"有效带宽占峰值百分比"评分,它直接回答:
  # 你离显存那堵墙还有多远、差的距离是不是"从 L1 取多了"造成的。
  bound: memory
  metric: bandwidth
  repeat: 50
  warmup: 10

  # 门槛由实测倒推(2026-09-28,4090,框架自动清 L2);评级取所有可评级用例里
  # 的最好成绩。下面每一行都真写过、真跑过(big = 16777216×512):
  #
  #   实现                                        big 用时   有效带宽   占峰值  评级
  #   基线:一输出一线程,窗口加一遍                 1.683 ms   80 GB/s    8%     —
  #   滚动和 + 每线程一段连续输出(CHUNK=32)         1.187 ms   113 GB/s   11%    —
  #   滚动和 + 每线程一段连续输出(CHUNK=128)        0.700 ms   192 GB/s   19%    —
  #   两趟全局:前缀和落 tmp + 再做差(4 个 kernel)   0.415 ms   324 GB/s   32%    B
  #   参考解:滚动和 + warp 交错 + shuffle scan     0.135 ms   993 GB/s   99%    S
  #   (ragged 用例上参考解 0.140 ms / 957 GB/s / 95%,评级一致)
  #
  # 四件必须写下来的事:
  #
  #   * **基线是"显存流量满分、L1 取数爆表"的样本。** 每个 x 元素只从显存走
  #     一次(相邻窗口的重复读全被 L1 接住了),但每个输出要发 w+1 = 513 条
  #     load。全卡 L1 的取数能力约 1e13 条 load/s(128 SM × 32 lane/cycle ×
  #     2.5GHz 量级),而显存墙只允许 126e9 个输出/s —— 相除就是每个输出
  #     ~80 条 load 的配额。513 条超了 6 倍,于是它的天花板就是带宽墙的
  #     1/6 上下(实测 8%,模型有 ~2 倍的不确定性,以实测为准)。
  #
  #   * **"滚动和"单独做,一分钱都不值(这是本题的坑)。** 它把每条链的
  #     指令数压下去了,代价是一个线程必须管连续的一段输出 —— 于是同一个
  #     warp 的 32 个 lane 访问的地址相隔 CHUNK 个 int,一条 load 指令覆盖
  #     32 个 sector,每个 lane 还独吞 4 条 cache line,几十个 warp 一起把 L1
  #     冲垮。实测 11%(CHUNK=32)~ 19%(CHUNK=128):**比基线快两倍,离墙还有
  #     五倍。** 08 题那个坑原样搬了过来 —— 只是这次它不是"没写对",而是
  #     "算法要求它这么写"。CHUNK 调大只是把亏空从初值那侧挪到 L1 这侧。
  #
  #   * **两趟全局是"用流量换简单"的完整方案,实测 32%。** 它的物理上限很
  #     清楚:中间结果要落一次显存,流量从 8 字节/元素变成 16 字节/元素
  #     ⇒ 最高就是峰值的 50%。它两趟都完全合并、指令数极低,所以它输给参考解
  #     的原因是**账**,不是手艺。这条路的含义是:想省掉"重复算",不一定非要
  #     融合 —— 也可以接受多搬一趟,前提是你知道这一趟值多少。
  #
  #   * **参考解贴到了 99%:把"连续"这件事从线程手里拿走,交给 warp。**
  #     warp 内 32 个 lane 仍然交错取数(合并保住),而"滚动"由 warp 内的
  #     前缀和(shuffle scan)完成。代价从 O(w) 掉到 5 条指令/输出。
  #
  # 门槛卡在实测的**空隙**里(两边的余量都 ≥ 20%):
  #   B=25 —— 高于"滚动和 + 连续分块"家族的最好成绩(19%),低于两趟方案的
  #            32%。含义:**两本账都要结清** —— 光"少算"不行(19% 那一档
  #            就是只做了少算),光"会合"也不行(那是基线)。注意这条门槛
  #            是**故意**卡在 19% 之上的:如果卡到 15%,"改对了算法却把访存
  #            赔进去"那种写法就能拿到 B —— 而那恰恰是本题要拆穿的错觉。
  #   A=45 —— 高于两趟的 32%,给"把两趟写得更紧(省掉加 carry 那一趟、
  #            用 chained scan 一个 kernel 搞定)"和"融合了一半"留出位置;
  #            低于参考解的一半。
  #   S=80 —— 两趟方案在物理上到不了这里(它的流量就是 16 字节/元素),
  #            想过 80% 只能走融合;参考解 99%,留了 19% 的余量。
  # 注意梯子的形状:**11% → 19% 是同一个坑的两个深度,19% → 32% 要换思路,
  # 32% → 99% 之间没有斜坡**(要么把访存修好,要么没有)。
  grades: {B: 25, A: 45, S: 80}

sanitize:
  memcheck: true
  racecheck_case: tiny
