id: cpp02-sum-reduction-chain
title: 归约求和:打断那条串行的累加链
subject: cpp
difficulty: 2
tags: [reduction, latency, ilp, simd, memory-bandwidth, optimization]
concepts: [串行依赖链, 指令级并行(ILP), 多累加器, 拓宽转换的吞吐, 为什么编译器不会帮你向量化归约]
statement: problem.md

# ---- 接口契约 ----
buffers:
  # fill: positive → (0, 1]。刻意不用默认的 uniform [-1,1):
  # uniform 下求和是随机游走,期望和只有 ~sqrt(n) 量级,正负相消会让
  # 「累加精度」退化成对消误差问题,和本题要教的东西无关。
  # positive 下部分和单调增长,是最"温和"的求和场景。
  - {name: x, dtype: f32, shape: [n], role: in, fill: positive}
  # 输出用 f64:和约为 n/2 ≈ 2.1e6,f32 在这个量级上的分辨率只有 0.25,
  # 用它当输出等于在判分环节再引入一次舍入,没必要。
  - {name: out, dtype: f64, role: out}
params:
  - {name: n, dtype: i32}

entry:
  function: sum_reduce       # 你要改的就是这个函数

cases:
  # big 是评分用的规模(16MB,超出 L2 也超出清缓存缓冲能留住的范围);
  # odd 是质数规模,考收尾处理 —— 32 路展开的余数是 3,漏掉就会算错;
  # tiny 只用于快速的结构检查,太小不参与评级
  - {name: big,  params: {n: 4194304}}
  - {name: odd,  params: {n: 1000003}}
  - {name: tiny, params: {n: 1000}}

verify:
  # 输出是标量,量级 n/2 ≈ 2.1e6,所以容差实际由 rtol 决定:
  #   rtol=1e-5 → big 上允许误差 21
  # 实测的三档精度(2026-09-26,都在这台机器上跑出来的):
  #   double 串行 / double 多路 / double SIMD   → 误差 ~1e-9  (余量 10 个数量级)
  #   float 8 路累加                            → 误差 3.03   (过,但见题面说明)
  #   float 串行累加                            → big 用例**判错**
  # 门槛两侧都留着数量级的余量,不存在"擦边"。
  atol: 1e-3
  rtol: 1e-5
  repeat: 2

perf:
  enabled: true
  bound: compute
  metric: speedup
  # 基线(big)实测约 4.1ms,所以 repeat 不用默认的 50 ——
  # 那会变成 60 次 × 4.1ms + 60 次清缓存,纯属白等。12 次足够取中位数。
  repeat: 12
  warmup: 3
  # 门槛由实测倒推(2026-09-26,本机 EPYC 7763;参考解见 optimal.cpp)。
  # ★ 测量时机器负载已经很高(/proc/loadavg 的 1 分钟均值 = 148),
  #   所以下面这些数字是**带负载**的数字,不是空闲时的漂亮数字。
  #
  #   big(n=4194304)  基线 4.09~4.10ms
  #     ├ 2 路标量累加器        2.074ms   1.97x
  #     ├ 4 路标量累加器        1.414ms   2.91x   ← 标量天花板
  #     ├ 8 路标量累加器        1.420ms   2.88x   ← 和 4 路一样,没收益
  #     ├ 16 路标量累加器       1.420ms   2.88x   ← 仍然一样
  #     └ SIMD(vcvtps2pd)      0.696ms   5.87x   ← 参考解
  #   odd(n=1000003)  基线 ~0.97ms
  #     └ SIMD                 0.151ms   6.42x   ← 参考解的最好事例(空闲时)
  #
  # 参考解评级连测 4 次(odd,best-case):6.42x / 5.78x / 5.69x / 5.57x。
  # 同一天、同一份代码,跨度 15% —— 这台机器是共享的,负载在 148 上下浮动。
  # 门槛按**最差的那次(5.57x)**倒推,不按 6.42x。
  #
  # 定档依据:
  #   B=1.5 —— 2 路累加器(实测 1.97x)就够,留 31% 余量。
  #            这一档的意思是"你真的看懂了依赖链"。
  #   A=2.3 —— 4 路以上(实测 2.88~2.91x)够,留 21% 余量。
  #            标量路线到这里就封顶了,再堆累加器没有用 ——
  #            所以 A 和 S 之间必然有一个台阶(2.9x → 5.6x),这是本题的真实结构。
  #   S=4.2 —— 必须跨过标量天花板,也就是必须把拓宽转换也向量化。
  #            4.2 是最差一次观测(5.57x)的 75%,留 32% 余量。
  #            没有取 90%:CPU 侧跨进程噪声 6~7%,而这台机器长期高负载,
  #            把 S 卡在实测上限附近会变成"你挑了个机器空闲的时候测" ——
  #            这跟本框架拒绝缓存基线耗时是同一条理由。
  #
  # ★ 复核时下调 S:4.2 → 3.8(2026-09-26,人工复核)
  #   出题者只采了 4 个样本(最差 5.57x),复核时又跑了 6 次:
  #     odd  5.71 / 6.33 / 5.08 / 5.85 / 6.29   + `validate --all` 里 4.57
  #   实际下限比标定时看到的低 —— 4.2 距离 4.57 只剩 8% 余量,低于本机
  #   已知的 6~7% 跨进程噪声,`leet validate` 会时灵时不灵。
  #   这不是"门槛设错了",而是**样本太少**:同一天的负载浮动就有 25%。
  #   3.8 距观察到的最差一次(4.57x)有 17% 余量。
  #   语义没有变化:标量天花板是 2.91x,所以 S 取 3.0~5.0 之间任何值
  #   都等价于"你用了 SIMD",取更稳的那个不损失区分度。
  grades: {B: 1.5, A: 2.3, S: 3.8}
  # ★ 这是一道**优化题**:基线本身就是正确代码,所以只看正确性的话
  #   把原代码原样交回来就算通过。设了 required_grade 之后,
  #   「通过」= 正确性 + 评级达标。
  required_grade: B
  flush_l2: true

sanitize:
  # cpp 科目暂未接入 ASan/UBSan(见 subjects/cpp.py)
  memcheck: false
