id: py03-pairwise-distance
title: 成对平方距离矩阵
subject: pytorch
difficulty: 3
tags: [broadcast, matmul, memory-traffic, oom, pytorch]
concepts:
  - 广播(unsqueeze)不是免费的 —— 它把 (n,1,d) 与 (1,m,d) 摊成真实存在的 (n,m,d) 张量
  - 中间张量的元素数是三个维度的乘积;动手写算子前先把它换算成字节数
  - 用算力换带宽:把 (a-b)² 展开,让一次矩阵乘把 d 这一维「吸收」掉
  - 原地算子(mul_ / add_)省掉中间结果的一遍写 + 一遍读

# x 是 (rows, d) 的 f32 行连续张量,前 n 行是集合 A、后 m 行是集合 B。
# 之所以把两组拼成一个缓冲而不是给两个输入:框架对同一用例里所有 role=in 的
# 缓冲用**同一个种子**填充(种子只由用例名派生),两个缓冲会拿到同一串随机数
# —— n == m 时 x 与 y 逐元素相同,自距离矩阵对角线恒为 0,还能靠"只用 x
# 不用 y"蒙混过关。拼成一个缓冲,两组数据天然不同。
buffers:
  - {name: x,   dtype: f32, shape: [rows, d], role: in}
  - {name: out, dtype: f32, shape: [n, m],    role: out}
params:
  # 形状表达式只支持「参数名 / 整数字面量」,不支持加法,所以 rows 必须显式给出。
  # 不变量:rows == n + m(每个用例都成立,见下面的 cases)。
  - {name: rows, dtype: i32}
  - {name: n,    dtype: i32}      # 集合 A 的行数 = out 的行数
  - {name: m,    dtype: i32}      # 集合 B 的行数 = out 的列数
  - {name: d,    dtype: i32}      # 特征维度

entry:
  function: forward

cases:
  # out 是 4096² × 4B = 67MB,而朴素实现摊出来的中间张量是
  # 4096*4096*32*4 = 2.1GB(平方之后再来一个 2.1GB),实测基线 9.73ms ——
  # 远高于计时器分辨率,可评级。
  # 注意 d 在**三个用例里全部一致**(32):加速比 ≈ 4d / (输出被搬几遍),
  # d 一变,那一个用例的天花板就与别的不成比例,而评级取各用例的最大值。
  - {name: square, params: {rows: 8192, n: 4096, m: 4096, d: 32}}
  # 输出 34MB,但形状又瘦又长、且 n/m 都是质数(不整除任何块大小):
  # 矩阵乘的分块边界与输出边界都会走到,考边界处理。
  - {name: odd,    params: {rows: 6146, n: 4093, m: 2053, d: 32}}
  # 最小的用例:n / m 都是质数、形状接近正方形,负责边界处理;
  # 同时「模板必须失败 / 劣化解必须失败」的区分度检查只挑最小的用例跑。
  # 两个约束把它夹在中间:
  #   ① d 必须与另外两个用例**一致**。加速比 ≈ 4d / (输出被搬几遍),d 一大
  #      这个用例的天花板就远高于别的用例,评级取最大值 —— 会被它一家垄断,
  #      区分度归零(实测 d=2053 的版本就是这样:cdist 和最优解都拿 S)。
  #   ② 中间张量必须**远大于 L2(72MB)**,否则基线自己就不走显存了,
  #      连最优解都可能被启动开销压到比基线还慢,框架会给出「你的实现比基线
  #      还慢」这种**误导性**提示(实测 34MB 的版本就是如此)。
  # 这里中间张量 304MB(4 倍于 L2):实测基线 1.42ms、最优解 36µs。
  - {name: prime,  params: {rows: 3084, n: 1531, m: 1553, d: 32}}

verify:
  # 参考解在 CPU 上用 float64 计算。实测:直接相减再求和的实现 max_err ≈ 1e-6;
  # 展开式(见 problem.md 的「方向二」)在 d=32 时 max_err = 7.6e-06、
  # cdist 是 1.1e-05 —— 容差按它们留了 2 个数量级余量。
  # 但对「少乘一个 2」「忘了转置」「只算了 A 内部的距离」这类真实错误
  # (误差是 O(10),而参考值本身才 O(20))仍然紧得离谱。
  atol: 1e-3
  rtol: 1e-3
  repeat: 3

perf:
  bound: memory
  metric: speedup
  repeat: 30
  warmup: 5
  # 输出只有 67MB,小于 4090 的 72MB L2 —— 必须清缓存,否则测到的是缓存带宽。
  flush_l2: true
  # 门槛由实测倒推(单位:相对基线的加速比,评级取各用例的最大值)。
  # 实测的物理模型非常干净:朴素实现的流量 = 4 遍 × (n,m,d);任何"不物化
  # d 维张量"的实现,流量 = (输出被搬几遍) × (n,m)。所以
  #     加速比 ≈ 4d / (输出被搬的遍数) = 128 / 遍数        (d = 32)
  # 实测(square / odd / prime):
  #   基线(物化 (n,m,d))                  1.00 / 1.00 / 1.00
  #   分块塞进 L2(CH=64)                  1.69 / 1.67 / 1.74   ← 启动开销吃掉大部分收益
  #   分块塞进 L2(CH=32)                  3.70 / 1.57 / 1.67
  #   cdist + pow_                        27.0 / 40.4 / 25.6   ≈ 5 遍
  #   恒等式 + 原地 mul_/add_ 链           28.4 / 45.5 /  —     ≈ 5 遍
  #   范数折进矩阵乘(k = d+2,只写一遍)    108.1 / 75.8 / 39.4  = 1 遍 ← 天花板
  #    (小用例上启动开销占比大,所以同一个实现在三个用例上的倍数不同 ——
  #     评级取最大值,square 通常说了算。)
  # 三档分别卡在实测的空隙里,两侧都留了余量:
  #   B=1.4 —— 分块塞进 L2 那一档(最差 1.57,高它 12%);仍然物化 d 维张量的
  #            写法都在 1.0~1.1(原地 pow_ 并不减少字节数,只省显存);
  #   A=8   —— 真的把 d 维张量消掉就能拿到(调好的分块最高 3.70,低它 2.2 倍;
  #            而 5 遍那档最低 25.6,高它 3.2 倍);
  #   S=60  —— 必须把输出压到 1~2 遍(5 遍那档最高 45.5,低它 32%;
  #            1 遍那档最低 39.4… 在 prime 上被启动开销拖住,靠 square 的 108.1 拿到)。
  grades: {B: 1.4, A: 8.0, S: 60.0}

sanitize:
  # 纯 PyTorch 题:没有自定义 CUDA kernel,memcheck 只会拖慢而无所得。
  # (如果学习者自己用 load_inline 写了自定义算子在解答里,那是解答侧的事。)
  memcheck: false
