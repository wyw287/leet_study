id: 15-array-stats
title: 一次遍历算三个统计量(和 / 最小 / 最大)
difficulty: 2
tags: [reduction, fusion, multi-pass, memory-bound, two-stage-reduction]
concepts:
  - 显存流量是这题唯一的成本:每多遍历一遍,就多付一次 256MiB 的钱
  - 融合(fusion):一个线程同时维护三个累加器,数据只读一次
  - 跨块归约的两条路:每块把 partial 写下来再启一个 kernel / 直接用原子操作
  - 浮点没有 atomicMin/atomicMax —— 这条事实会直接改变你选哪条路
  - 归约的加法顺序变了,结果就不再逐位相同(容差为什么必要)
statement: problem.md

# x 是 n 个 [-1,1) 的 float;三个输出都是**标量**(shape 为空列表)。
#
#   sum     = Σ x[i]
#   min_val = min x[i]
#   max_val = max x[i]
#
# 值域取 [-1,1) 而不是 (0,1] 是**故意的**,理由是测试强度:
#   * 均匀分布下 sum ≈ N(0, n/3),n = 2^26 时标准差约 4730 —— 一个**绝对值
#     不大**的量(实测:big 用例 |sum| = 3500,ragged = 1.1e4)。如果改用正数
#     填充,sum 会是 3.3e7,rtol=1e-4 给出的容差就是 3300 —— 漏掉几千个元素
#     都测不出来。现在容差只剩 0.36 / 1.11,紧得多。
#   * min ≈ -1、max ≈ +1(而不是 (0,1] 时的 min ≈ 3e-8)。min 是真值 3e-8 的话,
#     任何"把 min 初值写成 0 然后忘了更新"的实现拿 |0 - 3e-8| ≈ 3e-8 就能过 ——
#     而这正是本题最典型的错法之一(见题面「陷阱提醒」)。取到负数之后,
#     同样的错法会差 1.0,稳稳被抓。
buffers:
  - {name: x,       dtype: f32, shape: [n], role: in}
  - {name: sum,     dtype: f32, shape: [],  role: out}
  - {name: min_val, dtype: f32, shape: [],  role: out}
  - {name: max_val, dtype: f32, shape: [],  role: out}
  # scratch:框架只负责分配(每轮开始前清零),不参与对拍。
  #
  # 给的是「每块一个三元组 (sum, min, max),最多 max_blocks 块」的空间 ——
  # 走"第一级 kernel 每块写自己的 partial、第二级 kernel(单块)把它们合起来"
  # 这条路时需要它。这是本题最省心的块间归约方式,也是参考解用的方式。
  #
  # 不用就完全别理它(你甚至可以不启动那么多块)。
  - {name: partial, dtype: f32, shape: [max_blocks, 3], role: scratch}
params:
  - {name: n, dtype: i32}
  # 学习者的 grid 不允许超过它 —— 也就是 partial 能装下的块数。
  # 注意它是**上限**不是要求:开 128 块、1024 块、8192 块都合法。
  - {name: max_blocks, dtype: i32}

entry:
  kernel: array_stats
  launcher: array_stats_launch

cases:
  # 两个可评级用例都是 2^26 量级 = 256MiB 读,4090 上 DRAM 下限约 266µs ——
  # 远高于 20µs 的评级下限,也远大于 L2(72MB)。
  #
  # **"远大于 L2"这两个用例都必须满足,一个都不能少。** 评级取「所有可评级
  # 用例里的最好成绩」,而这道题的全部梯度都建立在"每多读一遍就多一趟显存"
  # 上:如果某个用例能整个装进 L2(72MB = 18M 个 float),第二遍、第三遍就会
  # 被 L2 接住,三趟退化成一趟,基线白拿满分。
  - {name: big,    params: {n: 67108864, max_blocks: 8192}}   # 2^26,整除任何 2 的幂块大小
  # 67108859 = 2^26 - 5:非 2 的幂、不被 2/3/5/7 整除,也不是任何 2 的幂的倍数。
  # 它考两件事:
  #   ① 跨步循环的尾巴(n 不整除 grid × block,最后一个不完整的轮次要处理干净);
  #   ② 向量化的尾巴 —— 它不被 4 整除,想用 float4 就必须单独收尾。
  # 规模与 big 同量级(字节数只差 20 个),两个用例的带宽占比可比。
  - {name: ragged, params: {n: 67108859, max_blocks: 8192}}
  # 小到远低于 20µs 的评级下限,所以**不参与评级** —— 专职考边界,兼跑 racecheck
  # (racecheck 极慢,只能挂在最小的用例上)。它考两件事:
  #   ① n = 262147 不被 256 整除 ⇒ 跨步循环的最后一轮是不满的;
  #   ② 如果你的 grid 开得比 ceil(n / 块大小) 还大(比如图省事固定开满
  #      max_blocks 块),这里就会有 7000+ 个**领不到任何元素**的块 ——
  #      它们同样必须写下合法的 partial,而 min 的空块初值是 +inf 而不是 0。
  #      写成 0 会把最小值污染成 0,而且只有在这种"块比数据多"的用例上才暴露。
  - {name: tiny,   params: {n: 262147,   max_blocks: 8192}}

# 三个输出都是**跨块归约**的结果,所以容差的依据要说清楚:
#   * min / max:同一组数取最小/最大,**与顺序无关、无舍入**,任何正确实现都
#     逐位相同。给容差只是沿用框架的统一比较口径。真值约 ±1,所以 atol=1e-2
#     实际给出的鉴别力是「错 1% 以上就被抓」—— 把 min 初值写成 0、跨块漏合一块
#     这类错法都会差 O(1),必抓。
#   * sum:加法顺序变了,结果就不再逐位相同。实测(2026-09-29,4090):
#         big 用例 |sum| ≈ 3500,参考解的 max_abs_err = 9.8e-4,tolerance ≈ 0.36
#         ragged  |sum| ≈ 1.1e4,参考解的 max_abs_err = 2.0e-3,tolerance ≈ 1.1
#     也就是两个数量级的安全边际(用了 float4 的写法误差翻倍到 2.0e-3,
#     仍然有 180 倍余量)。而一个**错**的实现(min 被污染成 0、漏掉一个块、
#     跨块没合并)在 min/max 上差 O(1),离容差远得多 —— 这个容差既不冤枉
#     正确实现,也不放过错误实现。
verify:
  atol: 1e-2
  rtol: 1e-4
  # repeat=3:这题的快版本几乎一定要用 partial + 第二级 kernel,或者原子操作;
  # 前者的典型 bug 是块内归约漏一个 __syncthreads(读到别的线程还没写完的
  # 共享内存),后者的典型 bug 是初值 / 清零顺序。两种都「有时对有时错」。
  repeat: 3

perf:
  # 纯访存瓶颈:每个元素 4 字节读 + 可忽略的算术(1 次加、2 次比较)。
  # 算术强度远低于 4090 的平衡点,天花板 100% 由带宽决定。
  #
  # 用「有效带宽占峰值百分比」而不是加速比:框架算的字节数是**输入 + 输出
  # 各一遍**(256MiB + 12 字节,scratch 不计入),也就是说
  #     **100% = 「你把 x 恰好读了一遍」**。
  # 这个刻度是绝对的、有物理含义的,它直接回答本题唯一的问题:同一份数据
  # 你搬了几遍。(加速比的锚点是基线,而基线在这题里正好是被研究的对象 ——
  #  拿它当尺子就成了循环论证。)
  bound: memory
  metric: bandwidth
  repeat: 50
  warmup: 10
  # 门槛由实测倒推(2026-09-29,4090,框架自动清 L2);评级取所有可评级用例里的
  # 最好成绩。下面每一行都真写过、真跑过(big: 2^26 = 256MiB 读;ragged 的数字
  # 与 big 相差 ≤1%,所以只列 big):
  #
  #   实现                                        遍历遍数  big 用时   有效带宽  占峰值  评级
  #   基线:三趟 + 二级归约(见 baseline.cu)           3      0.855 ms   314 GB/s   31%    C
  #   一趟 + **串行**收尾(8192 块,收尾只用一个线程)   1      0.762 ms   352 GB/s   35%    C
  #   两趟:sum+min 一趟、max 一趟                     2      0.572 ms   469 GB/s   47%    B
  #   一趟 + 1024 块 + 串行收尾                       1      0.324 ms   830 GB/s   82%    A
  #   一趟 + 8192 块 + 32 线程收尾                    1      0.295 ms   910 GB/s   90%    S
  #   一趟 + 128 块(每 SM 一块)                      1      0.296 ms   907 GB/s   90%    S
  #   参考解:一趟 + 8192 块 + 并行收尾                1      0.289 ms   930 GB/s   92%    S
  #   参考解 + float4(带尾巴)                        1      0.289 ms   930 GB/s   92%    S
  #   (相对基线:1.00x / 1.12x / 1.49x / 2.64x / 2.90x / 2.89x / 2.96x / 2.96x)
  #
  # 四件必须写下来的事:
  #
  #   * **这道题的分数几乎完全等于 1/(读了几遍)。** 读一遍 = 266µs 是硬下限
  #     (268MB / 1008 GB/s),基线的 0.855ms 就是 3 × 266µs 再加一点点固定开销,
  #     参考解的 0.289ms 就是 266µs + 收尾的几 µs。31% → 47% → 92% 这三档之间
  #     **没有斜坡**,因为"读几遍"是个整数。这不是门槛没设好,这是题目的物理。
  #
  #   * **收尾写坏了能把融合赚到的全部赔回去 —— 这是本题最值钱的坑。**
  #     第二级 kernel 如果只用一个线程串行扫 partial,8192 块时那一趟要花
  #     ~0.47ms,**比主 kernel 的 0.29ms 还贵**:总时间 0.762ms,只比三趟的
  #     基线快 12%。而同一个串行收尾,块数封在 1024 时只花 35µs(总 0.324ms,
  #     82%)。同一个错误,块数差 8 倍,代价差 13 倍 —— 因为串行收尾的成本是
  #     O(块数),而主 kernel 的成本是 O(n)。这条同时说明了两件事:
  #     "融合"和"把每一级都并行"是两个独立的动作,缺一个都拿不到分。
  #
  #   * **float4 一分钱都不值(0.289ms 对 0.289ms,逐位相同)。** 它把访存指令
  #     数降到 1/4,但瓶颈在 DRAM 上,不在指令发射上(01 题的结论在这里复现)。
  #     唯一的副作用是多出一个尾巴要处理 —— 而 ragged 用例(2^26-5,不被 4 整除)
  #     正是为此设的。
  #
  #   * **块数在这题上几乎不敏感(128 块 = 90%,8192 块 = 92%)。** 主 kernel
  #     的瓶颈从头到尾都是流量,不是并行度:128 块 × 256 线程 = 32768 个线程,
  #     每个线程带着 3 个独立累加器和足够深的流水,已经能把 DRAM 喂饱了。
  #     所以"块数开多少"不是本题的分水岭 —— **收尾是否并行才是**。
  #
  # 门槛卡在实测的**空隙**里:
  #   B=40 —— 高于基线(31%)29%、高于"融合对了但收尾串行"的 35% 14%,
  #           低于两遍方案的 47% 17%。含义:**至少要把三遍并成两遍**;
  #           注意 35% 那一档是**故意**要挡住的 —— 它读的遍数对了,但把时间
  #           又还了回去,拿到 B 会传递"融合本身就是终点"的错觉。
  #   A=70 —— 高于两遍的 47% 33%,低于参考解的 92% 24%。这一档实测只有
  #           "读一遍了、但收尾还没并行起来"的实现落进来(1024 块 + 串行收尾
  #           = 82%),是个真实可达的窄带。
  #   S=85 —— 参考解 92%(留 8% 余量),而 90% 那一档(128 块 / 32 线程收尾)
  #           也够得着:要求把"读一遍"这条通路用到八成五以上,但不要求精调。
  #           两遍方案在物理上到不了这里(流量就是 2 × 256MiB ⇒ 上限 50%)。
  grades: {B: 40, A: 70, S: 85}

sanitize:
  memcheck: true
  racecheck_case: tiny
