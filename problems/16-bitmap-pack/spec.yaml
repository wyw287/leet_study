id: 16-bitmap-pack
title: 符号位图打包(32 个输出挤进同一个 word)
difficulty: 2
tags: [bit-packing, output-granularity, atomics, warp-vote, ballot, coalescing, memory-bound]
concepts:
  - 输出的"粒度"可以比线程大：一个 word 要凑够 32 个线程的结论才写得下去
  - 最直白的写法（一元素一线程 + atomicOr）正确但慢：同一个 word 被 32 个 lane 抢
  - 慢的不是"原子指令"，是"32 个 lane 轮着访问同一个地址"（实测 32 路 27% / 16 路 44% / 8 路 87%）
  - 争用和散读是两个独立的病：避开原子却把合并访存赔进去，净收益≈0
  - __ballot_sync：一条 warp 级指令就把 32 个 lane 的谓词凑成一个 word
  - 位序（哪一位对应哪个元素）和尾巴位必须清零，整数输出没有容差
statement: problem.md

# x 是 n 个 [-1,1) 的 float；bits 是 nw 个 u32，nw = ceil(n/32)。
#
# 语义：bit i = x[i] > 0。落在第 (i >> 5) 个 word 的第 (i & 31) 位上（LSB 是元素
# 序号小的那一个）。word 里超出 n 的那些位**必须是 0**。
#
# 这是一次真正的压缩：n 个 4 字节的输入变成 n/32 个 4 字节的输出。
# 也就是说每 128 字节的读只换来 4 字节的写 —— 流量账几乎全是读。
#
# nw 作为参数直接给出来（而不是让做题者自己算 ceil），是为了让"边界"这件事
# 集中在"尾巴位要清零"上，而不是分散在"我算的 ceil 对不对"上。
buffers:
  - {name: x,    dtype: f32, shape: [n],  role: in}    # fill 默认 uniform → [-1,1)
  - {name: bits, dtype: u32, shape: [nw], role: out}
params:
  - {name: n,  dtype: i32}
  - {name: nw, dtype: i32}

entry:
  kernel: pack_bits
  launcher: pack_bits_launch

cases:
  # 主力用例：2^26 个 float = 256MiB 读 + 2Mi 个 word = 8MiB 写，共 264MiB。
  # 4090 上 DRAM 下限约 275µs —— 远高于 20µs 的评级下限，也远大于 L2(72MB)，
  # 所以测到的是真显存带宽。n 是 32 的倍数 ⇒ 没有尾巴，这一档只考"快不快"。
  - {name: big,    params: {n: 67108864, nw: 2097152}}   # 2^26 / 2^21
  # 67108859 = 2^26 - 5：不是 2 的幂，也不是 32 的倍数。
  #   * 最后一个 word 只有 27 个有效位（bits 0..26），高 5 位必须为 0；
  #   * 最后一个 warp 里有 5 个 lane 是"越界的" —— 它们既不能用
  #     `if (i >= n) return;` 提前退出（__ballot_sync 要求全 warp 参与），
  #     也不能让它们的谓词变成 1（会把高 5 位点亮）。
  # 规模与 big 同量级（字节数只差 20 个），两个用例的带宽占比可比。
  - {name: ragged, params: {n: 67108859, nw: 2097152}}
  # 小到远低于 20µs 的评级下限，所以**不参与评级** —— 专职考边界，兼跑
  # racecheck（racecheck 极慢，只能挂在最小的用例上）。它考三件事：
  #   ① 262147 = 8192*32 + 3 ⇒ 最后一个 word 只有 3 个有效位，高 29 位要清零；
  #   ② 262147 不被 256 整除 ⇒ grid 向上取整后最后一个 block 大量空线程，
  #      而且最后一个**整** warp 的 lane 0 的下标可能已经 >= n（w 越界）；
  #   ③ 只开一个 warp 的极小规模，专门用来看原子操作/投票指令在"没有争用"时
  #      是什么样子（此时 atomicOr 反而比 ballot 快，这也是个值得知道的事实）。
  - {name: tiny,   params: {n: 262147,   nw: 8193}}

# bits 是整数输出，框架对整数要求**逐位精确相等**（atol/rtol 不参与整数比较）。
# "最后一位舍入误差"这种借口在这题上不存在：谓词是 bool，位是位。
verify:
  atol: 0.0
  rtol: 0.0
  # repeat=3：这题的主力写法（原子操作）本身是无竞态的，但一旦有人用共享内存
  # 或"每块一个 word 的部分结果"来中转，漏一个 __syncthreads 就会"有时对有时错"。
  repeat: 3

perf:
  # 访存瓶颈：每读进 4 个字节只做 1 次比较，写那头只有 1/8 字节。
  # 用"有效带宽占峰值百分比"评分：框架算的字节数是**输入 + 输出各一遍**
  # （256MiB + 8MiB），所以 100% = "你把 x 恰好读了一遍、把 bits 恰好写了一遍"。
  # 这个刻度是绝对的，它直接回答本题唯一的问题：你离那面墙还有多远。
  bound: memory
  metric: bandwidth
  repeat: 50
  warmup: 10

  # 门槛由实测倒推（2026-09-29，4090，框架自动清 L2）；评级取所有可评级用例里
  # 的最好成绩。下面每一行都真写过、真跑过（big：n = 2^26 = 264MiB 访存；
  # ragged 的数字与 big 相差 ≤1%，所以只列 big）：
  #
  #   实现                                          用时      有效带宽   占峰值  评级
  #   基线：一元素一线程 + atomicOr 到全局            1.019 ms  272 GB/s   27%     C
  #   一线程一个 word，32 次连续标量读                0.847 ms  327 GB/s   32%     C
  #   两元素一线程 + atomicOr（16 路争用）            0.624 ms  444 GB/s   44%     B
  #   一线程一个 word + float4 读                     0.329 ms  842 GB/s   84%     S
  #   八元素一线程 + atomicOr（4 路争用）             0.315 ms  878 GB/s   87%     S
  #   四元素一线程 + atomicOr（8 路争用）             0.314 ms  881 GB/s   87%     S
  #   共享内存中转（strided 读有 32 路 bank conflict） 0.298 ms  929 GB/s   92%     S
  #   参考解：__ballot_sync                           0.293 ms  945 GB/s   94%     S
  #   块内私有化（共享内存原子 + 每 word 单写者）      0.293 ms  945 GB/s   94%     S
  #
  # 四件必须写下来的事：
  #
  #   * **这题只有一个病：同一个 word 被多少个 lane 抢。** 上表里唯一真正的
  #     自变量就是"争用路数"：32 路 → 27%，16 路 → 44%，8 路 → 87%，4 路 → 87%。
  #     注意最后两行：**争用降到 8 路以下之后,再降一分钱都不值**（878 vs 881,
  #     在噪声里）—— 那时候瓶颈已经交还给 DRAM 了。所以这道题的完整曲线是
  #     "一段陡坡 + 一块平台",陡坡在 16 路到 8 路之间。
  #
  #   * **"原子操作慢"这句话是错的,正确的说法是"抢得多才慢"。** 8 路争用那一行
  #     仍然是**每个元素各自 atomicOr**,一个字节都没少发,却跑到了 87%。
  #     原子指令本身不贵,贵的是同一地址被 32 个 lane 轮着来 —— 每一次都要一次
  #     L2 往返。这个事实在 07 题（直方图）里以"私有化"的面目出现过一次,
  #     这里是它的另一面。
  #
  #   * **"搬得散"和"抢得凶"是两个独立的病,得分开治。** 第二行（一线程一个
  #     word、32 次连续标量读）把争用彻底消掉了（每个线程独占一个 word,
  #     连原子都不需要),却只有 32% —— 因为它把"连续性"从 warp 手里拿走了:
  #     同一个 warp 的 32 个 lane 访问的地址相差 128 字节,一条 load 指令要碰
  #     32 个不同的 sector。这是 13 题那个坑的另一种形态。
  #     它拿到 float4（第四行）就跳到 84% —— **向量化治的是"指令数",不是
  #     "字节数"**,而这里正好卡在指令那一侧。
  #
  #   * **84% ~ 94% 那一段里,手段不重要,账目才重要。** float4 分块、共享内存
  #     中转、块内私有化、__ballot_sync —— 四条完全不同的路,全部落在 84~94%。
  #     因为它们都已经在做同一件事:**把 x 合并地读一遍、让每个 word 只有一个
  #     写者**。到了这一步再抠技巧,收益是 10% 量级,不是 10 倍量级。
  #
  # 门槛卡在实测的空隙里:
  #   B=38 —— 高于"32 路争用"的 27% 和"搬得散"的 32%,低于"16 路争用"的 44%。
  #           含义:**必须动争用**。注意 32% 那一档是**故意**要挡住的:
  #           它老老实实避开了原子操作(很多人以为这就是答案),但代价是把
  #           合并访存赔了进去,净收益接近于零。
  #   A=62 —— 高于 16 路争用的 44%（41% 余量),低于 84%(35% 余量)。
  #           含义:**争用基本消掉、但还没贴到墙**。实测里这一带是空的
  #           （44% 之后直接跳到 84%）—— 不是门槛没设好,是这题的物理:
  #           16 路到 8 路之间没有中间态,要么你还在抢,要么你不抢了。
  #           这一档留给"方向对了但还差一口气"的实现（比如尾巴没处理好、
  #           网格开得太小、块大小选得离谱）。
  #   S=82 —— 参考解 94%(留 15% 余量),而 84/87/92 那一整段也够得着:
  #           要求"确实贴到了墙",但不要求精调。
  grades: {B: 38, A: 62, S: 82}

sanitize:
  memcheck: true
  racecheck_case: tiny
