id: 17-column-sum
title: 按列求和(把 rows 个向量按元素加起来)
difficulty: 2
tags: [reduction, parallelism, dim0, two-stage-reduction, atomics, memory-bound]
concepts:
  - 并行度的上限是「工作被切成了几份」,不是「数据有多大」
  - 「块数 × 每块 warp 数 × 每 warp 在飞的访存数」—— 三个因子都要数
  - 一个输出要吃掉 rows 个输入 ⇒ 输出只有 cols 个时,「一输出一线程」把整张卡饿死
  - 块数被 ceil(cols/32) 钉死 ⇒ 想填满 128 个 SM,只能把 rows 也切开(两阶段 / 原子)
  - 合并不是免费的:partial 的流量、第二个 kernel、memset 都要记账
  - 为什么这题没有容差:值域是 0..99 的整数,和不超过 2^24,浮点加法在这里是精确的
statement: problem.md

# x 是 rows×cols 的 f32 矩阵(row-major,线性下标 i*cols + j),out 是长度 cols 的向量:
#
#   out[j] = Σ_{i=0}^{rows-1} x[i][j]
#
# 换个说法:**把 rows 个长度为 cols 的向量按元素加起来**。这是"沿 dim 0 归约",
# 在真实代码里到处都是(把一批梯度/embedding 累加起来、把 attention 的多个头
# 加起来、按列做统计量……),但它是前面 16 道题里唯一没出现过的形状:
#
#   04 题:输入 n 个,输出 1 个     → 一个输出由几百个线程协作产生,是归约的常识
#   01 题:输入 n 个,输出 n 个     → 一个线程一个输出,正好
#   17 题:输入 rows×cols,输出 cols —— **每个输出要吃掉一整列,输出却只有 cols 个**
#
# ★ 值域 0..99 的整数(randint 填 0..99)是刻意选的,它让这道题**没有任何容差**:
#   最大可能的和是 rows*99 = 131072*99 = 12,976,128,小于 f32 能精确表示整数的
#   边界 2^24 = 16,777,216。于是**任何一步部分和都是精确可表示的整数**,浮点加法
#   在这里不产生任何舍入 —— 顺序加、树形加、atomicAdd 乱序加,结果逐位相同。
#   所以:
#     * 判分可以要求精确相等(测试强度拉满);
#     * "我的浮点结果差一点点"在这里不是借口;
#     * atomicAdd 和两阶段两条路的结果必须一模一样。
#   ⚠️ 这条性质等价于 **rows*99 < 2^24**,即 rows < 169,462。用例的规模就是按
#      这条界选的,别随手把 rows 改大 —— 越过它,串行累加会静默出错:
#      f32 的 ulp 在 2^24 处从 1 跳到 2,部分和一旦越过它,"每次加一个整数"
#      就不再是精确运算,而且**不同累加顺序会给出不同结果**,
#      于是"逐位精确比较"这条判据本身失效(参考解和你的实现都会对不上)。
buffers:
  - {name: x,   dtype: f32, shape: [rows, cols], role: in, fill: randint}
  - {name: out, dtype: f32, shape: [cols],       role: out}
  # scratch:框架只负责分配,不初始化、也不参与对拍。
  #
  # 走"把 rows 切成若干段,每段先算部分和,再用第二个 kernel 合起来"这条路时
  # 需要它:形状是 [max_chunks, cols] —— 第 c 段、第 j 列的部分和放在
  # partial[c*cols + j]。这也是参考解走的路。
  #
  # 走 atomicAdd 那条路(直接往 out 上累加)就完全不用理它。
  - {name: partial, dtype: f32, shape: [max_chunks, cols], role: scratch}
params:
  - {name: rows, dtype: i32}
  - {name: cols, dtype: i32}
  # 学习者的"行分段数"(或者说第一阶段 gridDim.y 的上限)不允许超过它 ——
  # 也就是 partial 能装下的段数。注意它是**上限**不是要求:分 2 段、8 段、
  # 256 段都合法。
  - {name: max_chunks, dtype: i32}

entry:
  kernel: colsum
  launcher: colsum_launch

cases:
  # 主力用例:131072×512 = 2^26 个元素 = 256MiB 读 + 2KiB 写,4090 上 DRAM
  # 下限约 266µs —— 远高于 20µs 的评级下限,也远大于 L2(72MB)。
  #
  # ★ 形状是**故意**选的,三条缺一不可:
  #
  #   ① **cols 要小**(这里 512),否则"一列一线程"的并行度就够了,梯度消失。
  #      基线的线程数 = cols = 512 ⇒ **2 个 256 线程的块** = 16 个 warp,
  #      而这张卡有 8192 个 warp 槽位(128 SM × 64)。实测基线 9% 峰值。
  #      这是这道题的全部物理:**不是搬得太多,是没人搬。**
  #   ② **块数被 ceil(cols/32) 钉死。** cols=512 ⇒ 任何"一个 block 包一段列、
  #      自己扫完所有行"的写法,块数上限就是 16 个 —— 128 个 SM 里最多用 16 个。
  #      实测:16 个瘦块(256 线程)23%,16 个胖块(1024 线程)72%,
  #      **怎么调块形状都到不了 90%**。想填满这张卡只能把 rows 也切开。
  #      这一条是这道题的门槛能立住的物理依据:cols 再大一档(比如 4096),
  #      块数就够了,"必须切行"这个结论立刻不成立。
  #   ③ **rows×99 < 2^24**(见文件头那段):rows=131072 时是 1.298e7,
  #      离 1.678e7 有 29% 的余量,而且**与随机数怎么填无关**(99 是上界)。
  - {name: big, params: {rows: 131072, cols: 512, max_chunks: 256}}

  # ★ 边界用例:131071 = 2^17-1 是梅森质数,509 是质数,两个都不是 32 的倍数。
  #   * cols=509:ceil(509/32) = 16 个列 tile 覆盖 512 列 —— 每行多出 3 个越界列;
  #     最后一个 tile 里 29/32 的 lane 是有效的,warp 尾巴是空的;
  #   * rows=131071:行分段除不尽(每段的行数前后差 1),最后一个 warp 的行也是空的。
  #   * 元素数 131071*509 = 66,715,139,和 big(67,108,864)只差 0.6%,而且
  #     tile 数同样是 16 ⇒ **两个可评级用例的带宽占比可比**。这一点很重要:
  #     评级取所有可评级用例里的**最好成绩**,任何一个用例能装进 L2、
  #     或者小到测的是启动开销,都会让所有人白拿 S。
  - {name: ragged, params: {rows: 131071, cols: 509, max_chunks: 256}}

  # 小到远低于 20µs 的评级下限,所以**不参与评级** —— 专职考边界,兼跑 racecheck
  # (racecheck 极慢,只能挂在最小的用例上)。它考三件事:
  #   ① cols=509 不是 32 的倍数:warp 尾巴的空 lane 有没有去写 out?
  #   ② rows=257 是质数,而且小于任何合理的"行分块"整数倍 —— 行分段在
  #      "行数比一个 tile 还少"时会整段空转,空转的段写的 partial 必须是 0;
  #   ③ 规模只有 130k 个元素,两阶段方案的第二阶段(读 partial 再写 out)
  #      在这里占比被放大,内存检查会同时覆盖"越界读 partial"和"越界写 out"。
  - {name: tiny, params: {rows: 257, cols: 509, max_chunks: 256}}

# 输出是整数(0..99 的整数之和),而且任何部分和都 < 2^24 ⇒ 任何累加顺序都
# 逐位相同 ⇒ 精确比较,不需要容差。见文件头"值域"那段。
verify:
  atol: 0.0
  rtol: 0.0
  # repeat=3:这题最典型的两类 bug 都是"有时对有时错"的 ——
  #   * 块内按列归约时漏一个 __syncthreads(读到别人写了一半的格子);
  #   * 两阶段方案里 partial 的下标算错、但恰好落在合法范围内(小用例上碰巧对)。
  # 跑一次是抓不住的。
  repeat: 3

perf:
  # 访存瓶颈:每个输入元素只做 1 次加法(0.25 FLOP/Byte),远低于 4090 的
  # 平衡点 ⇒ 天花板 100% 由带宽决定。用"有效带宽占峰值百分比"评分,它直接
  # 回答本题唯一的问题:**你离那面墙还有多远**。
  #
  # 框架算的字节数 = "x 读一遍 + out 写一遍"(256MiB + 2KiB),所以 100% 的含义
  # 是"每个输入元素恰好从显存走了一次"。两阶段方案额外搬的 partial
  # (segs*cols*4 字节,写 + 读各一遍)不会从分子里扣,但会实打实地花掉时间
  # —— 它体现在分数上。这就是"多搬的那一趟要记账"的含义。
  bound: memory
  metric: bandwidth
  repeat: 50
  warmup: 10

  # 门槛由实测倒推(2026-09-29,4090,框架自动清 L2)。**每一行都真写过、真跑过**,
  # 而且下面这批是**同一次运行里**测的(共享卡上有邻居在跑,跨次比较会漂 ±3~5%,
  # 所以同批测量才有意义)。big 用例:rows=131072, cols=512, 268MB 流量。
  #
  #   两阶段(块内 (32,8),块间按行分段):
  #     块数        16     32     64    128    256    512   1024   2048   4096
  #     占峰值      22%    42%    71%    91%    94%    93%    91%    91%    91%
  #
  #   路 A(一个 block 包一整列,不做块间合并 —— 块数恒为 16,只能改块大小):
  #     块形状   (32,4)      (32,8)      (32,16)      (32,32)
  #     线程数    128         256          512         1024
  #     占峰值    12%         23%          41%          72%
  #
  #   基线(一列一线程,2 个块):3.011 ms / 89 GB/s = **9%**
  #
  #   散读映射(语义不变,只把 lane→数据的映射换成"同一个 warp 的 32 个 lane
  #   读同一列的 32 个不同行"),块数从 128 涨到 2048 时:
  #     块数       128     256     512    1024    2048
  #     占峰值     84%     70%     60%     36%     41%
  #
  # 四件必须写下来的事:
  #
  #   * **基线慢的原因不是访存。** 它每个元素只读一次(流量满分),相邻 lane 读
  #     相邻的列(合并满分,一条 load 正好 128 个连续字节)。它只是**只有 512 个
  #     线程** —— 2 个块,128 个 SM 里 2 个在干活。
  #
  #   * **台阶由"在飞的东西有多少"决定,不由算法名字决定。**
  #     路 A 那张表最值钱:同一个算法、同样 16 个块,只把块从 128 线程加胖到
  #     1024 线程,12% → 72%。但块数被 ceil(cols/32)=16 钉死,所以它到头也就
  #     72%(而且 1024 已经是块的上限了)。**想再往上只有一条路:把 rows 切开,
  #     让块数本身变多** —— 两阶段那张表:128 个块开始进入 90% 档。
  #
  #   * **"合并"这一步很便宜,但不是免费的。** partial 的流量占比 =
  #     2*segs/rows —— **和 cols 无关**。segs=8 时 0.01%,segs=256 时 0.4%。
  #     所以 94%(256 块)到 91%(4096 块)那点差不是"搬得多",是第二个 kernel
  #     的启动开销和负载不均开始显形。段数挑 8~256 之间都在噪声里。
  #
  #   * **散读那张表要单独说:它在低并行度下是被掩盖的。** 128 个块时它还有
  #     84%(那时候卡还没填满,多出来的 L1/L2 事务不要钱);块数一上去,
  #     同一个 kernel 掉到 36~60%。**这就是"两个病可以互相掩护"的样本** ——
  #     16 题讲过"争用和散读是两个独立的病",这里补一句:**低并行度会掩盖散读**,
  #     所以"我改成散读之后分数没掉"不能证明散读没问题,只能证明你还没撞到墙。
  #
  # 门槛卡在实测的**簇间空隙**里(B 和 A 两边余量 ≥ 19%;S 的下侧只有 8% ——
  # 因为 72% 是路 A 的硬上限、91% 是"填满"的地板,这段空隙天生就窄,
  # 是这道题的物理,不是门槛没设好):
  #   B=30 —— 高于基线(9%)与"瘦块路 A"(12~23%),低于"切了行(哪怕只切 2 段)"
  #            的 42%。含义:**你得先意识到"一输出一线程"这件事是错的**,
  #            并且真的动手把 rows 切开(或者把块加胖到 512 线程以上)。
  #   A=50 —— 高于 41~42%,低于 60~72% 那一簇 20%。含义:**并行度这一维
  #            你得填到 64 个块上下**,但离"每个 SM 都有活干"还有距离。
  #   S=78 —— 高于 72%(路 A 的极限)8%,低于 91~94% 那一簇 14%。含义:
  #            **块数要上到 128 个以上**=每个 SM 至少一个块。从 72% 到 91%
  #            实测没有中间档:64 个块和 128 个块之间是"一半 SM 在干活"和
  #            "每个 SM 都在干活"的差别,是台阶不是斜坡。
  grades: {B: 30, A: 50, S: 78}

sanitize:
  memcheck: true
  racecheck_case: tiny
