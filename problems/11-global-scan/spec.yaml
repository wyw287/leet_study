id: 11-global-scan
title: 全局前缀和(跨块扫描)
difficulty: 3
tags: [scan, prefix-sum, multi-kernel, grid-sync, memory-bound]
concepts:
  - 块与块之间没有任何同步原语 —— 依赖链跨过块边界时,只能靠 kernel 边界
  - 深度 O(log n) 但总功 O(n log n) —— Hillis-Steele 的 25 趟全局读写
  - 两遍法的总功是 3n:求和读一遍、扫描再读一遍、写一遍(为什么躲不掉第二遍读)
  - 三级结构:元素 → 块内 → 块间偏移,以及 phase 2 为什么必须是另一个 kernel
  - 块内扫描的 tile 循环携带进位(carry),以及它带来的那个额外 __syncthreads
statement: problem.md

# x 是被扫描的数组,y 是结果,part 是给选手自由使用的暂存区。
# 取 n 个元素而不是 nblk 个,是为了让"最朴素的做法"有地方落笔 ——
# 基线(Hillis-Steele 直接铺在整个数组上)需要一块和输入等长的乒乓缓冲。
# 参考解只用到其中前 nblk 个元素。
buffers:
  - {name: x,    dtype: f32, shape: [n],    role: in, fill: positive}
  - {name: y,    dtype: f32, shape: [n],    role: out}
  - {name: part, dtype: f32, shape: [n],    role: scratch}
params:
  - {name: n,    dtype: i32}
  # nblk 是**题目规定**的块数(也是段数)。为什么不让选手自己决定?
  # 因为段和数组 part[0..nblk-1] 的大小必须事先知道才能开缓冲。
  # 所有用例的 nblk 都不超过 1024 —— "用一个 block 扫完所有段和"这条路留着。
  - {name: nblk, dtype: i32}

entry:
  # 入口 kernel 名要与 template / baseline / optimal 里真实存在的那个函数一致。
  # 三阶段里的最后一段(把每段的扫描结果接上块间偏移)就叫 global_scan ——
  # 它是最终产出全局扫描结果的那个 kernel。
  kernel: global_scan
  launcher: global_scan_launch

# 分段约定(题面里也写了,因为参考解和基线都依赖它):
#   第 b 个块负责 [b*CH, min(n, (b+1)*CH)),CH = ceil(n / nblk)
# 于是"块 b 的段和"是良定义的,块间偏移也是良定义的。
cases:
  # 主力用例:2^25 个 float = 128MiB。nblk=1024 → CH=32768 整除得干干净净,
  # 每个块正好 32768 个元素。
  # 规模取 128MiB 的两个理由:① 20µs 的评级下限(128MiB 在 4090 上约 134µs);
  # ② 它必须**远大于 L2(72MB)** —— 否则基线的第 2..25 趟会命中 L2,
  #    那个 O(n log n) 的总功就体现不出来了(见题面第二节)。
  - {name: big,    params: {n: 33554432, nblk: 1024}}
  # 33000013 是质数;nblk=1000 不是 2 的幂 → CH = ceil(n/nblk) = 33001,
  # 1000×33001 > n,最后一个块只领到 32014 个元素(段长不满),
  # 而且"块数不是 2 的幂"会考到 phase 2 里那个扫描循环的边界。
  # 规模与 big 同量级(132MiB),两个用例的加速比可比。
  - {name: ragged, params: {n: 33000013, nblk: 1000}}
  # 1MiB,小到远低于 20µs 的评级下限 → **不参与评级**,专职考边界:
  # n=262147 是质数,CH = ceil(262147/64) = 4097,最后一个块只领到 4036 个;
  # 兼跑 racecheck。racecheck 极慢,只能挂在这么小的用例上。
  - {name: tiny,   params: {n: 262147, nblk: 64}}

verify:
  # 输入全是正数(x ∈ (0,1]),所以前缀和是单调上升的,末尾约 1670 万 ——
  # 不会有"正负相消导致真值接近 0、容差只剩 atol"的角落。
  # 误差预算(GPU 侧 f32,两遍法):
  #   * 块内那 128 个 tile 的扫描误差 ≈ eps·log2(256)·(tile 和) ≈ 1.2e-4
  #   * 块间偏移的误差 ≈ eps·log2(nblk)·(该块之前的元素和) ≈ 1.2e-7·10·1.6e7 ≈ 19
  #     但那个位置的容差是 rtol·|真值| ≈ 1e-4·1.6e7 = 1600 —— 差 80 倍,安全。
  # 反过来,任何结构性错误都远在这个容差之外:漏掉块间偏移 → 差 1.6e7;
  # 漏掉 tile 之间的进位 → 差 128;漏写一个 tile → 差 128。atol=1e-3 不会放过它们,
  # 也不会放过 "全填 0 / 全填 1 / 只写首元素" 这类劣化解。
  atol: 1e-3
  rtol: 1e-4
  # repeat=3:这题有共享内存 + 跨 kernel 的中间结果,"有时对有时错"的错法很多
  # (漏一个 __syncthreads、phase 2 读到了没写完的 part)
  repeat: 3

perf:
  # 纯访存:每个元素 2 次加法(N 次加法分给 N 个线程做,算术量可以忽略),
  # 瓶颈全在 DRAM 流量上。
  #
  # 用加速比而不是带宽占比:基线**跑得满带宽**,它只是多跑了 25 趟 ——
  # 两者的"有效带宽"都是 ~890GB/s,带宽指标根本分不出好坏。
  # 加速比在这里有精确的物理含义:总功之比。
  # (01/02/07/08 那种"朴素实现已贴着墙、慢是因为没铺满"的题才用带宽占比。)
  bound: memory
  metric: speedup
  repeat: 50
  warmup: 10
  # 门槛由实测倒推(2026-09-27,4090,框架自动清 L2);评级取所有可评级用例里的
  # 最好成绩。下面每一行都真写过、真跑过(big 用例:n=2^25,nblk=1024;
  # ragged 的加速比与 big 基本一致,只列 big):
  #
  #   实现                                          DRAM 流量  big     加速比  评级
  #   单线程串行(grid=1, block=1, double 累加)       2n    1327.9 ms  0.006x  C
  #   基线:Hillis-Steele 铺在整个数组上(25 趟)       50n    7.51 ms   1.00x   —
  #   半成品:三阶段,但阶段 3 让线程 0 串行扫一段      3n    1.730 ms   4.34x   B
  #   参考解:三阶段 + 块内 tile 并行扫描(BLOCK=256)  3n    0.455 ms  16.51x   S
  #   参考解 + BLOCK=512(只有块内线程数不同)         3n    0.451 ms  16.66x   S
  #
  # 四件必须写下来的事:
  #
  #   * **理论天花板就是 3n = 402MB**(求和读一遍 + 扫描再读一遍 + 写一遍),
  #     除以 1008GB/s 是 399µs;参考解实测 455µs = 天花板的 88%,
  #     加速比 16.51x = 上限 50n/3n ≈ 16.7x 的 99%。换句话说这道题的 S
  #     不是"还能更快",而是"已经到墙了"—— 剩下的 12% 里还有三次 kernel 启动
  #     的固定开销(约 15µs)和"纯读那一趟跑不满带宽"的物理事实(见 09 题)。
  #     上限不是 25x:**第二遍读 x 是两遍法躲不掉的代价**(段内的信息在阶段 1
  #     之后就没了)。想省掉它只有 decoupled look-back(单遍、2n),
  #     那要原子操作 + 内存序,超出本题范围 —— 见题面思考题 3。
  #
  #   * **这题的门槛是台阶**:1.00x 与 4.34x 之间实测是空的。Hillis-Steele 的
  #     每一趟都正确、每一趟都跑满带宽,从它出发无论怎么微调(调块大小、
  #     把一趟拆成两趟、块内先用共享内存走几步)都只是把 25 这个系数挪动几个点 ——
  #     理论上限也就 1.4x(块内共享内存只能省掉 log2(tile) 那几趟的全局往返)。
  #     真正值钱的一步是"认出总功可以从 O(n log n) 降到 O(n)",一跨就是十倍。
  #
  #   * **4.34x 那一行慢在哪,值得记下来:不是"块内扫得慢",是并行度塌了。**
  #     每个段只有 1 个线程在干活(一共 1024 个线程),每个线程同时只有 1 个
  #     未完成的 load。要跑满 1008GB/s 需要约 700KB 的在途数据,它只有 4KB ——
  #     于是有效带宽掉到 ~170GB/s。这是**延迟**受限,不是带宽受限。
  #     (同一件事的另一面:04 题的基线也是单块,却只慢 10~20 倍,因为那里
  #     归约只读不写 —— 循环里没有 store,编译器可以放手展开、把一堆互不依赖的
  #     load 叠在一起发出去;而扫描的每一步都卡在"读 → 加 → 写"这条链上,
  #     编译器没有 __restrict__ 就动不了它们。)
  #
  #   * 最后两行只差 0.9%:**块内线程数(256 vs 512)是噪声**。
  #     这直接印证了"本题的钱不在块内"—— 段内扫描是实现细节,
  #     阶段怎么切、切完之后并行度还剩多少,才是这道题的全部。
  #
  # 至于第一行(单线程串行)0.006x:**它比基线还慢 176 倍**。
  # 留这个数字有两个用处:① 说明"最笨的写法"会笨到什么程度;
  # ② 说明为什么不能拿它当基线 —— 加速比会在 0.006 与 16.5 之间摊开
  #    (跨了三个半数量级),S/A/B/C 四个档次就全挤在一起,失去刻度感。
  #    基线选 Hillis-Steele 是因为它**结构上是并行的、只是多做了 log n 倍功**,
  #    正好把这道题要教的那件事单独隔离出来。
  #
  # 门槛:
  #   B=2.5 —— 高于基线(1.00),也高于"在 Hillis-Steele 上做块内共享内存优化"
  #            的理论上限(约 1.4x),低于半成品的 4.34:
  #            要求总功真的从 O(n log n) 降到 O(n)
  #   A=8.0 —— 台阶中段:结构换对了,但某一步的并行度/访存没排好
  #            (比如段内只用了 32 个线程、或者多了几趟多余的全局往返)
  #   S=12.0 —— 参考解 16.51x 的 73%,留足余量:达标就意味着贴着 3n 那堵墙
  grades: {B: 2.5, A: 8.0, S: 12.0}

sanitize:
  memcheck: true
  racecheck_case: tiny
