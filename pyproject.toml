[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leetstudy"
version = "0.1.0"
description = "LeetCode 式的 CUDA 刷题框架:只写 kernel,回车即得对错、加速比与越界/竞态诊断"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "pyyaml>=5.4",
    "rich>=12.0",
]

[project.scripts]
leet = "leetstudy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# 前端是单个 HTML 文件,跟 webui 子包一起打包 —— 不声明的话
# 装出来的 wheel 里没有它,`leet web` 会报找不到页面。
# vendor/codemirror.js 同理:它是提交进仓库的**产物**(编辑器本体),
# 漏了它页面能打开但编辑区会退化成纯文本。
[tool.setuptools.package-data]
"leetstudy.webui" = ["index.html", "vendor/codemirror.js"]
