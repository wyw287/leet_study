<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>leet web</title>
<!-- Pygments 的 token 配色,服务端按扩展名选 lexer(见 server.py 的 _highlight) -->
<link rel="stylesheet" href="/api/highlight.css">
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --fg:#1c1f23; --dim:#6b7280; --line:#e3e6ea;
    --accent:#2563eb; --ok:#15803d; --bad:#b91c1c; --warn:#b45309;
    --code-bg:#f0f2f5; --shadow:0 1px 3px rgba(0,0,0,.06);
    --s:#7c3aed; --a:#2563eb; --b:#0891b2; --c:#6b7280; --zebra:#fafbfc;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15171a; --panel:#1d2024; --fg:#e6e8ea; --dim:#9aa1a9; --line:#2c3137;
      --accent:#60a5fa; --ok:#4ade80; --bad:#f87171; --warn:#fbbf24;
      --code-bg:#141618; --shadow:0 1px 3px rgba(0,0,0,.4);
      --s:#c4b5fd; --a:#93c5fd; --b:#67e8f9; --c:#9aa1a9; --zebra:#1a1d20;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
    "Hiragino Sans GB","Microsoft YaHei",sans-serif}
  a{color:var(--accent)}
  code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,
    "Liberation Mono",monospace}

  /* 布局 */
  .wrap{display:grid;grid-template-columns:280px 1fr;height:100vh}
  aside{background:var(--panel);border-right:1px solid var(--line);
    overflow-y:auto;padding:14px 10px}
  main{overflow-y:auto;padding:0}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}
    aside{display:none}}

  /* 侧栏 */
  .brand{font-weight:700;font-size:15px;padding:4px 8px 12px;
    display:flex;align-items:center;gap:8px}
  .brand small{font-weight:400;color:var(--dim);font-size:12px}
  .grp{color:var(--dim);font-size:11px;text-transform:uppercase;
    letter-spacing:.06em;padding:12px 8px 4px}
  .item{display:block;width:100%;text-align:left;border:0;background:none;
    color:inherit;font:inherit;padding:7px 8px;border-radius:7px;cursor:pointer}
  .item:hover{background:var(--code-bg)}
  .item.on{background:var(--accent);color:#fff}
  .item.on .sub,.item.on .id{color:rgba(255,255,255,.8)}
  .item .id{font-size:11px;color:var(--dim);display:block}
  .item .sub{font-size:12px;color:var(--dim)}
  .item .row{display:flex;justify-content:space-between;gap:6px;align-items:baseline}

  /* 主区 */
  header{padding:16px 22px;border-bottom:1px solid var(--line);
    background:var(--panel);position:sticky;top:0;z-index:5}
  header h1{margin:0 0 4px;font-size:18px}
  .meta{color:var(--dim);font-size:12px;display:flex;gap:10px;flex-wrap:wrap}
  .pill{background:var(--code-bg);padding:1px 7px;border-radius:99px}
  .tabs{display:flex;gap:2px;padding:10px 22px 0;border-bottom:1px solid var(--line);
    background:var(--panel);position:sticky;top:73px;z-index:4}
  .tab{border:0;background:none;color:var(--dim);font:inherit;padding:7px 13px;
    cursor:pointer;border-bottom:2px solid transparent}
  .tab.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
  .pane{padding:20px 22px 60px;display:none}
  .pane.on{display:block}

  /* 按钮 */
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  button.act{font:inherit;padding:6px 14px;border-radius:7px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel);color:var(--fg)}
  button.act:hover{border-color:var(--accent)}
  button.act.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.act:disabled{opacity:.5;cursor:not-allowed}
  /* 正在跑的那个按钮要看得出来是"它" —— 否则它和旁边几个禁用的按钮
     长得一样,还因为不是主按钮而更不显眼。 */
  button.act.running{opacity:1;border-color:var(--accent);color:var(--accent)}
  .status{color:var(--dim);font-size:12px;margin-left:auto}

  /* 编辑器 */
  textarea{width:100%;min-height:440px;padding:12px;border-radius:9px;
    border:1px solid var(--line);background:var(--code-bg);color:var(--fg);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13px;line-height:1.55;resize:vertical;tab-size:4}

  /* ---- 只读高亮(参考解)---- */
  pre.hl{margin:0;padding:12px;border:1px solid var(--line);border-radius:9px;
    background:var(--code-bg);overflow:auto;max-height:560px;font-size:12.5px;
    line-height:1.55;white-space:pre;tab-size:4}

  /* ---- 编辑器叠加 ----
     一个透明的 textarea 骑在一份高亮后的 <pre> 上。这样既能编辑又有实时高亮,
     而且高亮规则和「参考解」页是同一套(都来自服务端的 Pygments)。

     两层的 font / line-height / padding / tab-size / white-space / 各种 wrap
     必须**逐项一致**,差一点光标就会和文字错位。改动这里时别只改一层。

     **两层都不滚动**:高度由 JS 的 fitEditor() 按内容撑开,纵向交给页面滚;
     横向用 pre-wrap 折行。这样就不需要"把 textarea 的滚动位置同步给 pre" ——
     而那个同步正是最初的 bug 来源(pre 里的 <code> 不是滚动容器,同步设了个寂寞,
     表现就是「滚动条动了、字不动」)。没有滚动,就没有同步可错。 */
  .ed{position:relative;overflow:hidden;background:var(--code-bg);
    border:1px solid var(--line);border-radius:9px;height:320px;
    margin-bottom:14px}
  .ed pre,.ed textarea{position:absolute;top:0;left:0;width:100%;height:320px;
    margin:0;border:0;padding:12px;box-sizing:border-box;overflow:hidden;
    font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    tab-size:4;letter-spacing:normal;word-spacing:normal;
    white-space:pre-wrap;overflow-wrap:normal;word-break:normal}
  /* 编辑器里的 pre 要**解掉** pre.hl 的 max-height:560px —— 那是给「参考解」页
     只读预览用的上限。留在这里的话,高度被卡在 560,而它有 pointer-events:none,
     鼠标滚不动它 —— 560 以下的内容就永远够不着了。 */
  .ed pre{background:transparent;pointer-events:none;
    max-height:none;overflow:hidden}
  .ed pre code{font:inherit;white-space:inherit;overflow-wrap:inherit}
  .ed textarea{background:var(--code-bg);color:var(--fg);caret-color:var(--fg);
    resize:none;outline:none}

  /* 打字期间:textarea 显示自己的文字(原生渲染,零延迟),高亮层藏起来。
     停下后(见 scheduleHighlight)再切回高亮层。

     为什么必须这样:可见的文字是 <pre> 画的,而它要等防抖 + 服务端往返才更新 ——
     于是每敲一个字符要过约 200ms 才看得见,手感就是"慢半拍"。
     服务端高亮不可能做到零延迟,所以只能让"即时反馈"由 textarea 自己负责。
     两个状态的字形度量完全一致,切换只是颜色变化,不会跳。 */
  .ed pre{visibility:hidden}
  .ed.hl-on textarea{color:transparent;background:transparent}
  .ed.hl-on pre{visibility:visible}

  /* 输出 */
  pre.out{background:var(--code-bg);border:1px solid var(--line);border-radius:9px;
    padding:12px;overflow:auto;max-height:420px;font-size:12.5px;
    white-space:pre-wrap;word-break:break-word;margin:0}
  .spin{display:inline-block;box-sizing:border-box;width:11px;height:11px;
    margin-right:7px;border:2px solid currentColor;border-right-color:transparent;
    border-radius:50%;animation:spin .65s linear infinite;vertical-align:-1px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---- 题面 + 目录 ----
     宽屏时目录吸附在右侧(题面限宽 76ch,右边本来就空着一大片);
     窄了就藏起来 —— 那种宽度下正文自己就占满了。
     #p-stmt.on 而不是 #p-stmt:得让 .pane{display:none} 在非激活时仍然生效。 */
  /* 正文 : 目录 = 3 : 1,整块居中。
     之前是「正文限 76ch + 目录固定 186px、左对齐」—— 结果是目录挤在正文边上,
     右边留一大片空白,比例看着就不对。改成按比例分 + 居中,空白均分到两侧。
     总宽 880 = 正文 630 + 间距 40 + 目录 210。 */
  #p-stmt.on{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);
    gap:40px;max-width:880px;margin:0 auto;align-items:start}
  #p-stmt .md{max-width:none}      /* 宽度交给上面那栏,不再单独限 */
  .toc{position:sticky;top:128px;font-size:12.5px;line-height:1.5;
    max-height:calc(100vh - 170px);overflow-y:auto;
    border-left:1px solid var(--line);padding-left:13px}
  .toc-t{color:var(--dim);font-size:10.5px;text-transform:uppercase;
    letter-spacing:.07em;margin:0 0 7px}
  .toc a{display:block;color:var(--dim);text-decoration:none;
    padding:3px 0 3px 13px;margin-left:-14px;
    border-left:2px solid transparent}
  .toc a:hover{color:var(--fg)}
  .toc a.on{color:var(--accent);border-left-color:var(--accent);font-weight:600}
  /* 窄到这个宽度时,正文那栏会掉到 ~480px 以下 —— 目录就别再占地方了 */
  @media(max-width:1024px){
    #p-stmt.on{grid-template-columns:minmax(0,1fr);max-width:760px}
    .toc{display:none}
  }

  /* ---- 题面 ----
     由服务端用 markdown-it-py 渲染(见 server.py 的 _render_markdown),
     代码块交给 Pygments 上色。这里只管样子。

     正文宽度限制在 ~76 个字符:再宽,眼睛从行尾找回行首会开始丢行。 */
  .md{max-width:76ch;font-size:14.5px;line-height:1.75}
  .md>*:first-child{margin-top:0}
  .md>*:last-child{margin-bottom:0}
  .md h1{font-size:23px;line-height:1.3;margin:0 0 22px;letter-spacing:-.01em}
  /* 题面开头的 # 标题和页面顶部的题目名是同一个东西(18 份里 13 份只差个编号
     前缀,而编号在头部 meta 行里已经有)—— 隐掉,别让人以为有两个标题。 */
  .md>h1:first-child{display:none}
  .md h2{scroll-margin-top:132px;font-size:17px;margin:36px 0 13px;padding-bottom:7px;
    border-bottom:1px solid var(--line);letter-spacing:-.005em}
  .md h3{font-size:15px;margin:26px 0 9px}
  .md h4{font-size:14px;margin:20px 0 6px;color:var(--dim)}
  .md p{margin:12px 0}
  .md a{color:var(--accent);text-decoration:none;
    border-bottom:1px solid transparent}
  .md a:hover{border-bottom-color:currentColor}
  .md hr{border:0;border-top:1px solid var(--line);margin:26px 0}

  /* 列表 */
  .md ul,.md ol{margin:12px 0;padding-left:26px}
  .md li{margin:5px 0}
  .md li::marker{color:var(--dim)}
  .md li>ul,.md li>ol{margin:5px 0}

  /* 行内代码:995 处,是题面里出现最多的东西,值得单独调 */
  .md code{background:var(--code-bg);border:1px solid var(--line);
    padding:.12em .4em;border-radius:5px;font-size:.88em;
    /* pre-wrap 保住代码里的空格;break-word 只在**整段放不下时**才断行,
       所以 `ctx.x` 这种短的一般不会被拆,而 66 字符的长片段也不会撑破容器 */
    white-space:pre-wrap;overflow-wrap:break-word}

  /* 代码块。带语言的已由 Pygments 上色,没标语言的是普通等宽块 */
  .md pre{margin:15px 0;padding:13px 15px;border-radius:9px;
    background:var(--code-bg);border:1px solid var(--line);
    overflow-x:auto;font-size:12.5px;line-height:1.62}
  .md pre code{background:none;border:0;padding:0;font-size:inherit;
    white-space:pre}

  /* 引用 = 提示块。题面里 60 多处,基本都是「注意 / 提示」 */
  .md blockquote{margin:15px 0;padding:11px 16px;
    border-left:3px solid var(--accent);border-radius:0 8px 8px 0;
    background:var(--code-bg)}
  .md blockquote p{margin:6px 0}
  .md blockquote p:first-child{margin-top:0}
  .md blockquote p:last-child{margin-bottom:0}

  /* 表格:259 行,17/18 份题面都有,是最值得投入的一处。
     外面那层 .tw 由 wrapTables() 加上 —— 裸 table 没法既有圆角又能横向滚。 */
  .tw{margin:16px 0;border:1px solid var(--line);border-radius:9px;
    overflow-x:auto}
  .tw table{border-collapse:collapse;width:100%;min-width:max-content;
    font-size:13px;line-height:1.6}
  .tw th{background:var(--code-bg);font-weight:600;text-align:left;
    padding:8px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tw td{padding:8px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  .tw tbody tr:last-child td{border-bottom:0}
  .tw tbody tr:nth-child(even){background:var(--zebra)}
  .tw code{font-size:.87em}

  /* 判题结果 */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .verdict{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .big{font-size:17px;font-weight:700}
  .grade{font-size:26px;font-weight:800;line-height:1}
  .g-S{color:var(--s)}.g-A{color:var(--a)}.g-B{color:var(--b)}.g-C{color:var(--c)}
  table.cases{width:100%;border-collapse:collapse;font-size:13px}
  table.cases th,table.cases td{border-bottom:1px solid var(--line);
    padding:7px 9px;text-align:left;vertical-align:top}
  table.cases th{color:var(--dim);font-weight:500;font-size:12px}
  .hint{background:var(--code-bg);border-radius:8px;padding:9px 12px;margin:6px 0;
    font-size:13px;white-space:pre-wrap}
  details summary{cursor:pointer;color:var(--dim);font-size:12.5px}
  .empty{color:var(--dim);padding:30px 0;text-align:center}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:var(--fg);color:var(--bg);padding:9px 18px;border-radius:9px;
    font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <div class="brand">leet web <small id="qn"></small></div>
    <div id="list"></div>
  </aside>
  <main>
    <header id="hd"><h1>选一道题</h1>
      <div class="meta">左边点一下开始</div></header>
    <div class="tabs" id="tabs" style="display:none">
      <button class="tab on" data-p="stmt">题面</button>
      <button class="tab" data-p="code">解答</button>
      <button class="tab" data-p="result">判题结果</button>
      <button class="tab" data-p="opt">参考解</button>
    </div>
    <div class="pane on" id="p-stmt"><div class="md empty">…</div></div>
    <div class="pane" id="p-code"></div>
    <div class="pane" id="p-result"><div class="empty">还没有判题结果</div></div>
    <div class="pane" id="p-opt"><div class="empty">—</div></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let CUR = null;          // 当前题目 id
let DATA = null;         // 当前题目详情
let JOB = null;          // 正在轮询的任务
let JOB_ACTION = "";     // 跑的是哪个动作(test / bench / start)
let JOB_T0 = 0;          // 提交时刻,用来算用时
let JOB_PHASE = "";      // queued | running
let TICK = null;         // 只管刷新"已用多少秒",不影响轮询
/* 是否有未保存的改动 —— **和盘上的内容比**,不用布尔标志。
   用标志会踩坑:初始化时为了设置显示状态派发过一次合成的 input 事件,
   于是"刚打开一道题"就被标记成改过了,关页面时无端弹提醒。
   直接比内容还能顺带正确处理"改了又改回去"(那不算脏)。 */
let SAVED = null;            // 磁盘上那份的内容;null = 当前没有解答文件

function isDirty(){
  const ed = $("#ed");
  return !!ed && SAVED !== null && ed.value !== SAVED;
}

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("on"), 1800);
}

/* 题面目录(带当前位置高亮)。
   章节直接从渲染好的 <h2> 抓 —— 服务端不必再为目录多返回一份数据。
   锚点用 sec-N 而不是从标题文字生成 slug:标题里有中文和标点,slug 既丑又容易撞。 */
function buildTOC(root){
  const heads=[...root.querySelectorAll(".md h2")];
  const nav=root.querySelector("#toc");
  if(!nav) return;
  // 只有一两节的话目录纯属占地方
  if(heads.length < 3){ nav.remove(); return; }
  heads.forEach((h,i)=>{ h.id = "sec-" + (i+1); });
  nav.innerHTML = '<div class="toc-t">目录</div>' +
    heads.map((h,i)=>
      `<a href="#sec-${i+1}" data-i="${i+1}">${h.textContent}</a>`).join("");
  for(const a of nav.querySelectorAll("a")){
    a.onclick = e=>{
      e.preventDefault();
      const h = document.getElementById("sec-" + a.dataset.i);
      if(h) h.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  spyTOC(heads);
}

/* 滚动时点亮当前章节。监听的是 main(它是滚动容器,不是 window),
   拿"最后一个顶边还没越过阈值的标题"当当前节。 */
function spyTOC(heads){
  const main=document.querySelector("main"), nav=document.querySelector("#toc");
  if(!main || !nav) return;
  const links=[...nav.querySelectorAll("a")];
  const upd=()=>{
    const line = 150;                       // 吸附顶栏 + TOC 起始线
    let cur = 0;
    heads.forEach((h,i)=>{ if(h.getBoundingClientRect().top <= line) cur = i; });
    // 滚到底就把最后一节点亮 —— 否则最后一节永远够不到那条线,
    // 人已经在看了、目录里却还停在上一节。
    if(main.scrollTop + main.clientHeight >= main.scrollHeight - 4) cur = heads.length - 1;
    links.forEach((a,i)=> a.classList.toggle("on", i === cur));
  };
  if(main._tocSpy) main.removeEventListener("scroll", main._tocSpy);
  main._tocSpy = upd;
  main.addEventListener("scroll", upd, {passive:true});
  upd();
}

/* 宽表格套一层壳:裸 <table> 同时要圆角 + 横向滚动做不到,
   包一层 div 才行。markdown-it 输出的是裸 table,所以这里补一下。 */
function wrapTables(root){
  for(const tb of root.querySelectorAll("table")){
    if(tb.parentElement && tb.parentElement.classList.contains("tw")) continue;
    const w = document.createElement("div");
    w.className = "tw";
    tb.parentNode.insertBefore(w, tb);
    w.appendChild(tb);
  }
}

/* ---------- 侧栏 ---------- */
async function loadList(){
  const r = await fetch("/api/problems").then(r=>r.json());
  const ps = r.problems || [];
  $("#qn").textContent = ps.filter(p=>p.solved).length + "/" + ps.length;

  const groups = {};
  for(const p of ps) (groups[p.subject] ||= []).push(p);
  const NAME = {cuda:"CUDA", pytorch:"PyTorch", cpp:"C++ 优化题"};
  let html = "";
  for(const [sub, arr] of Object.entries(groups)){
    html += `<div class="grp">${esc(NAME[sub] || sub)}</div>`;
    for(const p of arr){
      const dot = p.solved ? "✓" : (p.started ? "•" : "");
      html += `<button class="item${p.id===CUR?" on":""}" data-id="${esc(p.id)}">
        <span class="row"><span class="sub">${esc(p.title)}</span>
          <span class="id">${dot}${p.best_grade?" "+esc(p.best_grade):""}</span></span>
        <span class="id">${esc(p.id)}</span></button>`;
    }
  }
  $("#list").innerHTML = html;
  for(const b of document.querySelectorAll(".item"))
    b.onclick = ()=> open(b.dataset.id);
  return ps;
}

/* ---------- 打开一道题 ---------- */
async function open(id){
  // 切走时**自动保存**,不再弹确认框打断人。存不下去才拦。
  if(!await flushChanges()) return;
  CUR = id;
  DATA = await fetch("/api/problems/"+encodeURIComponent(id)).then(r=>r.json());
  for(const b of document.querySelectorAll(".item"))
    b.classList.toggle("on", b.dataset.id === id);

  const s = DATA.spec || {};
  $("#hd").innerHTML = `<h1>${esc(s.title || id)}</h1>
    <div class="meta">
      <span class="pill">${esc(s.subject || "")}</span>
      ${s.difficulty?`<span class="pill">难度 ${esc(s.difficulty)}</span>`:""}
      ${(s.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join("")}
      <span>${esc(id)}</span></div>`;
  $("#tabs").style.display = "flex";

  // 题面由服务端用 markdown-it-py 渲染(代码块已交给 Pygments 上色)。
  // 拿不到就退回纯文本 —— 难看但不会白屏。
  if(DATA.statement_html != null){
    $("#p-stmt").innerHTML =
      `<div class="md">${DATA.statement_html}</div><nav class="toc" id="toc"></nav>`;
    wrapTables($("#p-stmt"));
    buildTOC($("#p-stmt"));
  } else {
    $("#p-stmt").innerHTML =
      `<pre class="out" style="white-space:pre-wrap">${esc(DATA.statement)}</pre>`;
  }
  // 参考解优先用服务端高亮好的 HTML(Pygments 已经把源码转义过了);
  // 拿不到就退回纯文本 —— 不影响功能。
  $("#p-opt").innerHTML = DATA.optimal
    ? (DATA.optimal_html != null
        ? `<pre class="hl"><code>${DATA.optimal_html}</code></pre>`
        : `<pre class="out">${esc(DATA.optimal)}</pre>`)
    : `<div class="empty">这道题没有参考解文件</div>`;
  renderResult(DATA.verdict);
  renderCode();
  // 支持 #code / #result / #opt 深链(刷新后停在原来那一页)
  const want = (location.hash || "").replace("#","");
  tab(["stmt","code","result","opt"].includes(want) ? want : "stmt");
  if(want) history.replaceState(null, "", "#" + want);
}

/* ---------- 解答 ---------- */
function renderCode(){
  const has = !!DATA.solution_path;
  // 重建面板前先记下编辑器当前高度。新建出来的 <pre> 是**空的**,拿它去量
  // 会把高度塌成最小值 —— 那正是判题结束时「闪一下像只剩一部分」的来源:
  // renderCode 重建 → 空 pre → 塌到 320px → 等高亮异步回来才恢复。
  // 内容这时并没变,高度本来就不该变,直接把旧高度接过去。
  const old = document.querySelector(".ed");
  const prevH = old ? Math.round(old.getBoundingClientRect().height) : 0;

  $("#p-code").innerHTML = `
    <div class="bar">
      ${has ? "" : `<button class="act primary" id="b-start">开始做题(生成解答文件)</button>`}
      ${has ? `<button class="act primary" id="b-save">保存</button>
               <button class="act" id="b-test">判题 test</button>
               <button class="act" id="b-bench">测性能 bench</button>` : ""}
      <span class="status">${has ? esc(DATA.solution_path) : "还没有解答文件"}</span>
      <span class="status" id="dirty" style="display:none;color:var(--warn)">● 未保存</span>
      <span class="status" id="prog" style="display:none"></span>
    </div>
    ${has ? `<div class="ed">
        <pre class="hl"><code id="edhl"></code></pre>
        <textarea id="ed" spellcheck="false" autocomplete="off"
                  autocapitalize="off" autocorrect="off"></textarea>
      </div>` : ""}
    <pre class="out" id="jobout" style="display:none;margin-top:12px"></pre>`;

  const st = $("#b-start");
  if(st) st.onclick = ()=> run("start");
  const sv = $("#b-save");
  if(sv) sv.onclick = async ()=>{
    const r = await save();
    if(r.ok){ markSaved(); toast("已保存"); } else toast(r.error);
  };
  const tt = $("#b-test");
  if(tt) tt.onclick = ()=> run("test");
  const bb = $("#b-bench");
  if(bb) bb.onclick = ()=> run("bench");

  const ed = $("#ed");
  if(ed){
    SAVED = DATA.solution;          // 盘上那份的基准
    ed.value = DATA.solution;
    if(prevH > 0){                  // 接住旧高度,别让它塌一下
      const box = document.querySelector(".ed"), pre = box.querySelector("pre");
      if(pre) pre.style.height = prevH + "px";
      ed.style.height = prevH + "px";
      box.style.height = prevH + "px";
    }
    ed.oninput = ()=>{ setPlain(); markDirty(); scheduleHighlight(); };
    // 粘贴/撤销不一定触发 oninput,补一次
    ed.addEventListener("paste", ()=> setTimeout(()=>{ setPlain(); scheduleHighlight(); }, 0));
    // 离开编辑区就立刻高亮(不用等防抖)
    ed.addEventListener("blur", ()=> highlightNow());
    // 初始化:先按纯文本显示,随即高亮。
    // ⚠️ 直接调函数,不要 dispatchEvent(new Event("input")) —— 那会让
    //    oninput 跑一遍,以前就是它把"刚打开"误标成"改过了"。
    setPlain();
    fitEditor();
    highlightNow();
  }
}

/* 未保存标记。切走会自动存,所以它更多是"我知道你改了"的提示,不用你操心。 */
function markDirty(){ const d=$("#dirty"); if(d) d.style.display = ""; }
function markSaved(){ const d=$("#dirty"); if(d) d.style.display = "none"; }

/* 切到"纯文本"态:textarea 显示自己的文字(原生渲染,零延迟),高亮层藏起来。
   打字时用 —— 见 fitEditor 上面的说明。 */
function setPlain(){
  const box = document.querySelector(".ed");
  if(box) box.classList.remove("hl-on");
}

/* 让编辑器长到刚好装下内容 —— 于是没有内层滚动,纵向交给页面。
   量高度用的是 **<pre> 的 auto 高度**:它是绝对定位的块元素,`height:auto`
   时自然按内容撑开,不会像"把 textarea 压到 20px 再量"那样动到编辑区 ——
   后者会让 textarea 为了保持光标可见而内部滚动,回来就对不齐了。

   ⚠️ 高度要设在 <pre> 上,不是它里面的 <code>(#edhl)。踩过两次:
   可见的是 <pre>,把 height/scrollTop 设到 <code> 上毫无效果 ——
   表现是「透明的 textarea 撑开了,可见的高亮层还卡在 320px,下半截一片空白」。 */
function fitEditor(){
  const box = document.querySelector(".ed");
  if(!box) return;
  const ed = $("#ed"), pre = box.querySelector("pre"), hl = $("#edhl");
  if(!ed || !pre) return;
  // ★ 面板隐藏时(display:none)后代什么都量不出来 — offsetHeight 恒为 0。
  //   照量的话 max(320, 0) = 320,编辑器就塌成最小高度;切回解答页只剩前
  //   十几行,非得编辑一下(触发高亮 → 面板已可见 → 重新量)才恢复。
  if(!box.getClientRects().length) return;
  // ★ 高亮还没落地时 <code> 是空的,量出来只有 padding —— 同样会把高度塌掉。
  //   等 highlightNow 把内容填上自然会再量一次,这里不要抢着设。
  if(hl && !hl.firstChild) return;
  pre.style.height = "auto";                      // <pre> 按内容撑高
  const h = Math.max(320, pre.offsetHeight);
  pre.style.height = h + "px";
  ed.style.height = h + "px";
  box.style.height = h + "px";
}

/* ---- 实时高亮:防抖 + 过期响应丢弃 ----
   走服务端(Pygments)而不是在前端塞一个高亮库,是为了和「参考解」页共用
   同一套着色规则。实测单次 1~4ms,本地往返完全撑得住打字。 */
let hlTimer = null, hlSeq = 0;

function scheduleHighlight(){
  clearTimeout(hlTimer);
  hlTimer = setTimeout(highlightNow, 180);
}

async function highlightNow(){
  const box = document.querySelector(".ed");
  const ed = $("#ed"), hl = $("#edhl");
  if(!box || !ed || !hl) return;
  const seq = ++hlSeq;
  const src = ed.value;

  if(!DATA.solution_lang){                 // 语言认不出来,退回纯文本
    hl.innerHTML = esc(src); box.classList.add("hl-on"); fitEditor(); return;
  }
  let html = null;
  try{
    const r = await fetch("/api/highlight", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({source: src, lang: DATA.solution_lang})});
    html = (await r.json()).html;
  }catch(_){ /* 网断了就保持纯文本,别把编辑区搞空 */ }

  if(seq !== hlSeq) return;                // 有更新的请求在路上,丢弃这次的
  hl.innerHTML = (html != null) ? html : esc(src);
  fitEditor();
  box.classList.add("hl-on");              // 高亮好了才切过去
}

async function save(){
  const ed = $("#ed");
  if(!ed || SAVED === null) return {ok:false, error:"还没有解答文件"};
  const r = await fetch(`/api/problems/${encodeURIComponent(CUR)}/solution`,
    {method:"PUT", headers:{"Content-Type":"application/json"},
     body: JSON.stringify({source: ed.value})}).then(r=>r.json());
  if(r.error) return {ok:false, error:r.error};
  SAVED = ed.value;                 // 记下盘上那份,isDirty 就是拿它比的
  markSaved();
  return {ok:true};
}

/* 切走前把改动落到盘上。存失败才拦人 —— 否则悄悄丢掉改动更糟。 */
async function flushChanges(){
  if(!isDirty()) return true;
  const r = await save();
  if(r.ok) return true;
  return confirm("自动保存失败:" + r.error + "\n\n仍然切走会丢掉刚才的改动。继续?");
}

/* ---------- 跑任务 ---------- */
async function run(action){
  if(action==="test" || action==="bench"){
    if(!await flushChanges()) return;     // 跑之前先把改动落盘,判的才是当前代码
  }
  const r = await fetch(`/api/problems/${encodeURIComponent(CUR)}/${action}`,
    {method:"POST"}).then(r=>r.json());
  if(r.error) return toast(r.error);
  JOB = r.job.id;
  JOB_ACTION = action;
  JOB_T0 = Date.now();
  JOB_PHASE = "queued";
  const out = $("#jobout");
  if(out){ out.style.display="block"; out.textContent = "已提交,排队中…\n"; }
  setBusy(true, action);
  startTick();
  poll();
}

const ACTION_CN = {test:"判题", bench:"测性能", start:"创建工作区", solution:"读参考解"};

function setBusy(busy, action){
  for(const id of ["b-save","b-test","b-bench","b-start"]){
    const el = document.getElementById(id);
    if(!el) continue;
    el.disabled = busy;
    // 记住原始文字 —— 任务结束后要变回去
    if(!el.dataset.label) el.dataset.label = el.textContent;
    const active = busy && action && id === "b-" + action;
    el.classList.toggle("running", !!active);
    if(active){
      el.innerHTML = `<span class="spin"></span>${ACTION_CN[action] || "处理"}中…`;
    } else {
      el.textContent = el.dataset.label;
    }
  }
}

/* 进度行:"排队中 · 0.4s" / "运行中 · 4.2s"。
   leet test 要 11~21 秒,光把按钮置灰等于没反馈 —— 至少得让人看见
   它在动、以及已经等了多久。 */
function startTick(){
  clearInterval(TICK);
  TICK = setInterval(paintProg, 100);
  paintProg();
}

function paintProg(){
  const el = $("#prog");
  if(!el) return;
  if(!JOB){ el.style.display = "none"; return; }
  const s = ((Date.now() - JOB_T0) / 1000).toFixed(1);
  el.style.display = "";
  el.style.color = "var(--dim)";
  el.innerHTML = (JOB_PHASE === "queued" ? "排队中" : "运行中")
    + ` <span style="opacity:.6">·</span> ${s}s`;
}

function stopTick(){
  clearInterval(TICK); TICK = null;
  const el = $("#prog"); if(el) el.style.display = "none";
}

async function poll(){
  if(!JOB) return;
  const r = await fetch("/api/jobs/"+JOB).then(r=>r.json());
  if(r.error){ JOB=null; stopTick(); setBusy(false); return toast(r.error); }
  const out = $("#jobout");
  if(out) out.textContent = r.output || "(没有输出)";
  if(out) out.scrollTop = out.scrollHeight;
  if(r.status === "running" || r.status === "queued"){
    JOB_PHASE = r.status;
    setTimeout(poll, 700); return;
  }
  const secs = ((Date.now() - JOB_T0) / 1000).toFixed(1);
  JOB = null; stopTick(); setBusy(false);
  if(r.status === "failed"){
    toast(`失败(退出码 ${r.returncode}) · 用时 ${secs}s`);
  } else {
    toast(`完成 · 用时 ${secs}s`);
    // 重新拉题目详情:解答可能刚由 start 生成,判题结果也刷新了
    DATA = await fetch("/api/problems/"+encodeURIComponent(CUR)).then(r=>r.json());
    renderResult(DATA.verdict);
    renderCode();
    await loadList();
  }
}

/* ---------- 判题结果 ---------- */
function fmt(v, n=3){
  if(v === null || v === undefined) return "—";
  if(typeof v !== "number") return esc(v);
  return Math.abs(v) >= 1e5 || (Math.abs(v) < 1e-3 && v !== 0)
    ? v.toExponential(2) : v.toFixed(n).replace(/\.?0+$/,"");
}

function renderResult(v){
  const el = $("#p-result");
  if(!v){ el.innerHTML = `<div class="empty">还没有判题结果 —— 去「解答」页点一下 test</div>`; return; }

  const g = v.grade || "";
  const req = v.required_grade;
  const head = `<div class="card"><div class="verdict">
    <span class="big" style="color:var(--${v.passed?"ok":"bad"})">
      ${v.passed ? "✅ 通过" : "✗ 未通过"}</span>
    ${g?`<span class="grade g-${esc(g)}">${esc(g)}</span>`:""}
    ${req?`<span class="meta">本题要求 ${esc(req)} 级</span>`:""}
    <span class="meta" style="margin-left:auto">
      判题耗时 ${fmt(v.seconds,1)}s
      ${v.created_at?`· ${new Date(v.created_at*1000).toLocaleString()}`:""}</span>
  </div>
  ${v.grade_short?`<div class="hint" style="margin-top:10px">
    正确性没问题,但这道题要求性能达到 <b>${esc(req)}</b> 级 —— 目前是
    <b>${esc(g||"无法评级")}</b> 级。这是一道优化题:把它改快才是目标。</div>`:""}
  ${v.build?`<div class="meta" style="margin-top:8px">
    ${v.build.ok?"编译 ✓":"编译 ✗"} ${fmt(v.build.seconds,1)}s</div>`:""}
  </div>`;

  let cases = "";
  if(v.cases && v.cases.length){
    cases = `<div class="card"><table class="cases">
      <thead><tr><th>用例</th><th>参数</th><th>正确性</th><th>稳定性</th>
        <th>性能</th><th>评级</th></tr></thead><tbody>` +
      v.cases.map(c=>{
        const raw = c.raw || {}, outs = raw.outputs || [];
        const bad = outs.reduce((a,o)=>a+(o.bad||0),0);
        const errs = outs.filter(o=>o.bad).map(o=>o.name+": "+o.bad+
          " 个不对,最大误差 "+fmt(o.max_abs_err)).join("; ");
        const gd = raw.guards || {};
        const gset = Object.entries(gd).filter(([,x])=>x.front||x.back)
          .map(([n,x])=>`${n} 越界${x.front?"前"+x.front:""}${x.back?"后"+x.back:""}`);
        const perf = c.perf || {};
        let p = "—";
        if(perf.median_ms!=null){
          p = fmt(perf.median_ms,3)+" ms";
          if(perf.gb_per_s>0) p += " · "+fmt(perf.gb_per_s,0)+" GB/s";
          if(c.speedup!=null) p += " · "+fmt(c.speedup,2)+"x";
        }
        if(c.too_small) p += `<br><span class="meta">样本太小,不评级</span>`;
        return `<tr>
          <td>${esc(c.case)}${c.ok?"":" <b style='color:var(--bad)'>✗</b>"}</td>
          <td class="mono">${Object.entries(raw.params||{}).map(([k,x])=>k+"="+x).join(", ")}</td>
          <td>${c.ok?"✓":"✗ " + esc(errs||"不对")}
              ${gset.length?`<br><span style="color:var(--warn)">${esc(gset.join("; "))}</span>`:""}</td>
          <td>${c.repeats_ok}/${c.repeats}</td>
          <td>${p}</td>
          <td class="${c.grade?"g-"+esc(c.grade):""}"><b>${esc(c.grade||"—")}</b></td>
        </tr>`;
      }).join("") + `</tbody></table></div>`;
  }

  const hints = (v.hints||[]).length
    ? `<div class="card"><h3 style="margin:0 0 8px;font-size:14px">提示</h3>` +
      v.hints.map(h=>`<div class="hint">${esc(h)}</div>`).join("") + `</div>` : "";

  const checks = (v.checks||[]).length
    ? `<div class="card"><h3 style="margin:0 0 8px;font-size:14px">内存/竞态检查</h3>` +
      v.checks.map(c=>`<div class="hint">${esc(c.tool)}:
        ${c.skipped?"跳过("+esc(c.skip_reason||"")+")":(c.ok?"✓ ":"✗ ")+esc(c.summary)}
        ${c.seconds?`<span class="meta"> ${fmt(c.seconds,1)}s</span>`:""}</div>`).join("") + `</div>` : "";

  const blog = (v.build && v.build.log)
    ? `<div class="card"><details><summary>编译输出</summary>
        <pre class="out" style="margin-top:8px">${esc(v.build.log)}</pre></details></div>` : "";

  el.innerHTML = head + cases + hints + checks + blog;
}

/* ---------- tab ---------- */
function tab(name){
  for(const t of document.querySelectorAll(".tab"))
    t.classList.toggle("on", t.dataset.p === name);
  for(const p of document.querySelectorAll(".pane"))
    p.classList.toggle("on", p.id === "p-" + name);
  if(location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
  // 切回解答页时补量一次:隐藏期间 fitEditor 是跳过的(量不出东西),
  // 高度可能还停在旧值或最小值上。
  if(name === "code") fitEditor();
}
for(const t of document.querySelectorAll(".tab"))
  t.onclick = ()=>{ flushChanges(); tab(t.dataset.p); };

/* 切走前提醒未保存 */
// 关标签页没法可靠地异步保存,所以这里保留提醒 —— 但它现在只在**真的**
// 改过、且还没保存时才触发(切换题目/标签页都会自动存,轮不到它)。
window.addEventListener("beforeunload", e=>{ if(isDirty()) e.preventDefault(); });

loadList().then(ps=>{
  const done = ps.find(p=>p.started) || ps[0];
  if(done) open(done.id);
});
setInterval(()=>{ if(!JOB) loadList().catch(()=>{}); }, 15000);
</script>
